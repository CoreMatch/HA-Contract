openapi: 3.1.0
info:
  title: Avalon Plugin Contract
  version: 1.2.0
  description: >-
    Versioned contract between the Avalon governance server (caller) and
    out-of-process plugins (HTTP servers). v1.0.0 (2026-11-07): initial
    registration — manifest negotiation, the room.create synchronous
    admission event, and the game.over asynchronous post-match event,
    including the bidirectional HMAC signature scheme, delivery guarantees,
    and failure policy. v1.1.0 (2026-11-08): the three-tier event contract
    (observe / veto / deliver) and the v2 event catalog — player.join
    (observe, veto when granted), player.leave, player.banned,
    player.unbanned, player.ipbanned, game.start, player.chat,
    unit.operation (observe, veto when granted), factory.build (observe,
    veto when granted); manifest per-event veto capability; observe-tier
    delivery is best-effort (in-memory queue, drop-oldest, no persistence,
    no replay); gameplay vetoes are bounded by a separate tight timeout.
    v1.2.0 (2026-11-08): the three scope-deferred v2 items —
    connection.new (connection-level veto admission before any protocol
    state exists; payload is connection-layer only, a veto disconnects
    silently with the reason logged server-side), game.start promoted to
    dual mode (pre-start veto when granted, same payload shape with
    match.startTime=0 before the start; the post-start observe emission is
    unchanged), and player.kicked (observe-tier audit emitted from the
    single kick choke point, carrying the kick reason and rejoin-lockout
    duration). Plugins are independent processes; neither the JVM engine
    shell nor Avalon loads plugin code. The authoritative design records
    are Avalon knowledge entries 0006 (v1) and the v2 implementation
    status entry; this file is the schema/endpoint registration.
servers:
  - url: http://127.0.0.1:9800/v1
    description: >-
      Example plugin-provided base. Each plugin serves its own base URL,
      declared by the operator in Avalon's plugin configuration. Avalon is
      the client of every endpoint below.

security:
  - avalonSignature: []

paths:
  /manifest:
    get:
      operationId: getManifest
      summary: Plugin self-description and version negotiation
      description: >-
        Fetched by Avalon at boot (per-plugin timeout bounded by Avalon's
        admission timeout) and re-fetched after connection-level delivery
        failures (backoff 5s..5min). The response must be signed with the
        plugin's shared secret (see the Avalon-Plugin-Signature header). A
        missing, unsigned, unparseable, or protocol-incompatible manifest
        marks the plugin unready: admission calls skip it (fail-open) and
        queued deliver-tier events are held until negotiation succeeds.
      responses:
        "200":
          description: Manifest accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manifest"
        default:
          description: >-
            Any non-2xx or unsigned answer is a negotiation failure; Avalon
            retries with backoff and keeps the plugin unready.

  /events/room.create:
    post:
      operationId: eventRoomCreate
      summary: Synchronous room-creation admission (tier veto)
      description: >-
        Sent before Avalon creates a room (boot-time singleton room,
        Cascade control-plane create, relay room). All subscribed ready
        plugins are called in parallel, each bounded by its effective
        timeout min(manifest timeoutMs, Avalon admissionTimeoutMs, default
        cap 2500ms). Any valid allowed=false vetoes the room; the reason is
        surfaced to the requester (relay error channel / Cascade 403
        message / boot console). Timeout, transport errors, non-2xx,
        invalid signatures, malformed bodies, and denies without a reason
        are errors and fail open (room allowed), WARN-logged. At-most-once:
        Avalon never retries this event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomCreateEvent"
      responses:
        "200":
          description: The admission decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomCreateVerdict"
        default:
          description: >-
            Non-2xx or invalid response: treated as an error, the admission
            fails open (allowed).

  /events/game.over:
    post:
      operationId: eventGameOver
      summary: Asynchronous post-match notification (tier deliver)
      description: >-
        Emitted after the room fires its game-over event. Delivery is
        at-least-once: per-plugin FIFO outbox persisted as a write-ahead
        log, replayed after Avalon restarts, retried with exponential
        backoff 1s..60s on timeout/transport failure/non-2xx/invalid
        signature. Each attempt is bounded by Avalon's delivery timeout
        (default 10s). Events older than the max age (default 24h) are
        dropped. Plugins MUST deduplicate on eventId and keep dedup state
        for at least 24 hours. Any 2xx is an ack; the response body is
        ignored but its signature is verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameOverEvent"
      responses:
        "200":
          description: Ack (any 2xx; body ignored, signature verified)
        default:
          description: "Non-ack: Avalon retries per the delivery guarantee."

  /events/player.join:
    post:
      operationId: eventPlayerJoin
      summary: Player joined the room (tier observe; tier veto when granted)
      description: >-
        Emitted after the player is registered in the room (the engine has
        already accepted the connection; a veto therefore takes effect as
        an immediate kick carrying the plugin's reason, not a refused
        connection). Two modes per plugin, decided by manifest declaration
        plus the operator's veto grant in Avalon's plugin configuration
        (default-deny): veto mode — synchronous admission bounded by
        admissionTimeoutMs, fail-open on error, allowed=false kicks the
        player with the reason; observe mode — best-effort async push
        (in-memory queue, drop-oldest, no persistence, no replay, no
        retry). Vetoed joins produce no observe notifications.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerJoinEvent"
      responses:
        "200":
          description: >-
            Veto mode: the decision (Verdict). Observe mode: ack, body
            ignored, signature verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verdict"
        default:
          description: >-
            Veto mode: error, fails open (player stays). Observe mode:
            dropped and counted.

  /events/player.leave:
    post:
      operationId: eventPlayerLeave
      summary: Player left the room (tier observe)
      description: >-
        Emitted when a player disconnects or is kicked. Best-effort observe
        delivery. The disconnect cause (voluntary / kicked / network drop)
        is not available to Avalon and is not part of this event;
        banRemainingMs > 0 indicates the player left with an active rejoin
        lockout (kick or ban with a ban window).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerLeaveEvent"
      responses:
        "200":
          description: Ack (any 2xx; body ignored, signature verified)
        default:
          description: Dropped and counted (observe tier, no retry).

  /events/player.banned:
    post:
      operationId: eventPlayerBanned
      summary: Player banned (tier observe)
      description: >-
        Emitted when a ban action fires against a player (console, client
        admin command, or Cascade facade). Best-effort observe delivery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerActionEvent"
      responses:
        "200":
          description: Ack (any 2xx; body ignored, signature verified)
        default:
          description: Dropped and counted (observe tier, no retry).

  /events/player.unbanned:
    post:
      operationId: eventPlayerUnbanned
      summary: Player unbanned (tier observe)
      description: >-
        Emitted when an unban action fires for a player. Best-effort
        observe delivery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerActionEvent"
      responses:
        "200":
          description: Ack (any 2xx; body ignored, signature verified)
        default:
          description: Dropped and counted (observe tier, no retry).

  /events/player.ipbanned:
    post:
      operationId: eventPlayerIpBanned
      summary: Player IP banned (tier observe)
      description: >-
        Emitted when an IP-ban action fires against a player. Best-effort
        observe delivery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerActionEvent"
      responses:
        "200":
          description: Ack (any 2xx; body ignored, signature verified)
        default:
          description: Dropped and counted (observe tier, no retry).

  /events/game.start:
    post:
      operationId: eventGameStart
      summary: Match started (tier observe; tier veto before start when granted)
      description: >-
        Dual-mode event. Veto mode (manifest veto declaration plus operator
        grant required, default-deny): consulted before the room starts a
        match — admin /start and the auto-start countdown converge on the
        same start path — with the pre-start room snapshot; match.startTime
        is 0 in this pre-start consultation. Synchronous, bounded by
        Avalon's admissionTimeoutMs (further capped by the plugin's manifest
        timeoutMs); it blocks only the start request. allowed=false cancels
        the start: the reason is shown to the initiating admin, or goes to
        the Avalon server log only when the start was automatic (no
        initiating player). Timeout, transport errors, non-2xx, invalid
        signatures, malformed bodies, and denies without a reason fail open
        (the match starts), WARN-logged and counted. At-most-once. Observe
        mode: emitted after the room successfully starts a match,
        best-effort delivery, match block is the start-time snapshot with
        the actual startTime. A vetoed start produces no observe
        notification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameStartEvent"
      responses:
        "200":
          description: >-
            Veto mode: the decision (Verdict). Observe mode: ack, body
            ignored, signature verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verdict"
        default:
          description: >-
            Veto mode: error, fails open (the match starts). Observe mode:
            dropped and counted.

  /events/player.chat:
    post:
      operationId: eventPlayerChat
      summary: Player chat message passed the built-in filters (tier observe)
      description: >-
        Emitted after the message passes the length / mute-all / chat
        filter checks; messages from muted players never reach plugins.
        Best-effort observe delivery. High frequency: plugins declaring
        this event should expect drop-oldest backpressure under load.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerChatEvent"
      responses:
        "200":
          description: Ack (any 2xx; body ignored, signature verified)
        default:
          description: Dropped and counted (observe tier, no retry).

  /events/unit.operation:
    post:
      operationId: eventUnitOperation
      summary: Player issued a unit order (tier observe; tier veto when granted)
      description: >-
        Emitted when Avalon parses a unit-order block from the client
        game-command stream. Observe mode: best-effort, high frequency.
        Veto mode (manifest declaration plus operator grant required):
        synchronous, bounded by Avalon's gameplay veto timeout
        (gameplayVetoTimeoutMs, default cap 250ms) because it blocks the
        issuing player's command stream; allowed=false stops the packet
        before the engine with no player-facing message (the veto reason is
        logged only); timeout/error fails open (operation proceeds).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitOperationEvent"
      responses:
        "200":
          description: >-
            Veto mode: the decision (Verdict). Observe mode: ack, body
            ignored, signature verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verdict"
        default:
          description: >-
            Veto mode: error, fails open (operation proceeds). Observe
            mode: dropped and counted.

  /events/factory.build:
    post:
      operationId: eventFactoryBuild
      summary: Player queued a factory build (tier observe; tier veto when granted)
      description: >-
        Emitted when Avalon parses a factory-build action (action id not
        starting with "_") from the client game-command stream. Same tier
        rules and timeout semantics as unit.operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FactoryBuildEvent"
      responses:
        "200":
          description: >-
            Veto mode: the decision (Verdict). Observe mode: ack, body
            ignored, signature verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verdict"
        default:
          description: >-
            Veto mode: error, fails open (operation proceeds). Observe
            mode: dropped and counted.

  /events/connection.new:
    post:
      operationId: eventConnectionNew
      summary: Connection-level admission before protocol handling (tier veto, granted)
      description: >-
        Consulted when a new transport connection presents its first packet,
        before any protocol state exists. The payload is connection-layer
        information only — the connection has not spoken the game protocol
        yet, so no player identity exists and none is carried. Requires both
        a manifest veto declaration and the operator's veto grant
        (default-deny), same gating as player.join. Synchronous, bounded by
        Avalon's admissionTimeoutMs (further capped by the plugin's manifest
        timeoutMs); the wait blocks only this connection's first packet, not
        other connections. allowed=false closes the connection immediately.
        There is no channel to surface the reason to the peer at this stage:
        the reason goes to the Avalon server log only. Timeout, transport
        errors, non-2xx, invalid signatures, malformed bodies, and denies
        without a reason fail open (the connection proceeds), WARN-logged
        and counted. At-most-once: Avalon never retries this event. The
        built-in IP/24 ban check runs first and takes precedence — a banned
        /24 is rejected without consulting plugins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionNewEvent"
      responses:
        "200":
          description: The admission decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verdict"
        default:
          description: >-
            Non-2xx or invalid response: treated as an error, the admission
            fails open (connection proceeds).

  /events/player.kicked:
    post:
      operationId: eventPlayerKicked
      summary: Player kicked (tier observe, audit)
      description: >-
        Emitted from the single choke point every kick funnels through —
        console/client admin commands, relay/gateway actions, ban-triggered
        kicks, and join-admission vetoes — including AI players (payload bot
        flag distinguishes them). reason is the kick text as issued;
        durationSec is the rejoin lockout in seconds (0 = kick without a
        rejoin lock). Best-effort observe delivery: a delivery failure drops
        the event and counts it — no retry, no persistence, no replay. This
        is the defined audit semantics of the observe tier: a kick is never
        re-driven or undone because its audit notification failed to
        deliver.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerKickedEvent"
      responses:
        "200":
          description: Ack (any 2xx; body ignored, signature verified)
        default:
          description: Dropped and counted (observe tier, no retry).

components:
  securitySchemes:
    avalonSignature:
      type: apiKey
      in: header
      name: X-Avalon-Signature
      description: >-
        Bidirectional HMAC-SHA256 scheme. Every Avalon request carries
        X-Avalon-Timestamp (unix seconds) and X-Avalon-Signature with
        v1=hex(HMAC-SHA256(timestamp + "." + raw_body, secret)). Every
        response Avalon accepts (manifest, verdict, ack) MUST carry the
        same two headers computed over the response body with the shared
        secret; Avalon verifies against the plugin's secret list (list
        overlap supports rotation; Avalon signs with the first secret and
        verifies with any). Timestamps off by more than 300s are rejected.

  parameters:
    AvalonTimestamp:
      name: X-Avalon-Timestamp
      in: header
      required: true
      schema:
        type: integer
      description: Unix seconds at request time; 300s skew tolerance.
    AvalonSignature:
      name: X-Avalon-Signature
      in: header
      required: true
      schema:
        type: string
      description: >-
        v1=hex(HMAC-SHA256(timestamp + "." + raw_body, secret)) over the
        raw request body.

  schemas:
    Manifest:
      type: object
      required: [schema, protocol, id, version, events]
      properties:
        schema:
          type: string
          const: avalon-plugin/manifest
        protocol:
          type: string
          const: avalon-plugin/v1
          description: Exact match required (the v1 protocol id covers v1.x).
        id:
          type: string
          description: Plugin self-identifier.
        version:
          type: string
          description: Plugin version, free form.
        events:
          type: object
          description: >-
            Event name -> capability. Avalon emits the highest mutually
            supported version; with no intersection the event is not
            delivered to this plugin. Declaring veto=true requests veto
            mode for a dual-mode event (player.join, unit.operation,
            factory.build, connection.new, game.start); it only takes
            effect when the operator's plugin configuration grants that
            event's veto to this plugin (default-deny). Without the grant
            the event is delivered in observe mode (for connection.new,
            which has no observe mode, without the grant the plugin is
            simply not consulted).
          additionalProperties:
            type: object
            required: [versions]
            properties:
              versions:
                type: array
                items:
                  type: integer
                minItems: 1
              veto:
                type: boolean
                default: false
        timeoutMs:
          type: integer
          description: >-
            Self-declared processing budget; Avalon caps it with its own
            admission timeout (and with the gameplay veto timeout for
            in-game vetoes). Absent or non-positive means the Avalon cap.
        maxConcurrency:
          type: integer
          description: >-
            Declared but reserved in v1/v2: Avalon runs one worker per
            plugin (ordering guarantee); values above 1 are treated as 1.

    EventEnvelope:
      type: object
      description: Fields shared by every event.
      required: [eventId, event, eventVersion, occurredAt, server]
      properties:
        eventId:
          type: string
          description: >-
            evt_ + 26-char Crockford ULID. Generated once at emit time;
            stable across retries and replays; plugins deduplicate on it.
          pattern: "^evt_[0-9A-HJKMNP-TV-Z]{26}$"
        event:
          type: string
        eventVersion:
          type: integer
        occurredAt:
          type: string
          format: date-time
          description: RFC 3339 UTC emit time.
        server:
          type: object
          required: [serverId, serverName, coreVersion]
          properties:
            serverId:
              type: string
            serverName:
              type: string
            coreVersion:
              type: string

    RoomRef:
      type: object
      description: The room the event belongs to.
      required: [kind, code]
      properties:
        kind:
          type: string
          enum: [server, cascade, relay]
          description: >-
            v2 gameplay events only occur in server-mode rooms (kind is
            "server"); room.create keeps all three kinds.
        code:
          type: string

    PlayerInfo:
      type: object
      description: >-
        Player identity as known to Avalon. In-game statistics
        (kills/losses/economy/positions/survive state) are engine interior
        and are deliberately not part of the contract. Every field is always
        serialized (no omitempty in the emitting struct), hence all are
        required per the ecosystem serialization convention.
      required:
        [name, uuid, team, slot, host, bot, spectator, admin, address]
      properties:
        name:
          type: string
        uuid:
          type: string
          description: connectHexID, the player's engine-side unique id.
        team:
          type: integer
        slot:
          type: integer
          description: Engine slot, 0-based.
        host:
          type: boolean
        bot:
          type: boolean
        spectator:
          type: boolean
        admin:
          type: boolean
          description: Room admin flag (including auto-admin).
        address:
          type: string
          description: Source IP when known, else empty string.

    Verdict:
      type: object
      description: Decision for a veto-tier call.
      required: [allowed]
      properties:
        allowed:
          type: boolean
        reason:
          type: string
          description: >-
            Mandatory when allowed=false. Human-readable; Avalon truncates
            to 200 runes and strips control characters before display. A
            deny without a reason is a malformed response and fails open.

    RoomCreateEvent:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [room, creator]
          properties:
            event:
              const: room.create
            eventVersion:
              const: 1
            room:
              type: object
              required: [kind, code, maxPlayers, isMod]
              properties:
                kind:
                  type: string
                  enum: [server, cascade, relay]
                  description: >-
                    server = boot-time singleton room; cascade = control
                    plane POST /v1/rooms/create; relay = relay-protocol
                    room.
                code:
                  type: string
                  description: >-
                    Room code/id. ServerID for kind=server; the requested
                    code for kind=cascade; the requested custom id for
                    kind=relay, empty when the relay id is auto-generated.
                maxPlayers:
                  type: integer
                isMod:
                  type: boolean
                  description: Relay mod-room flag; false for other kinds.
            creator:
              type: object
              required: [name, address]
              properties:
                name:
                  type: string
                  description: >-
                    console for kind=server; cascade for kind=cascade; the
                    creating player's name for kind=relay.
                address:
                  type: string
                  description: Source IP when known, else empty string.

    RoomCreateVerdict:
      type: object
      required: [allowed]
      properties:
        allowed:
          type: boolean
        reason:
          type: string
          description: >-
            Mandatory when allowed=false. Human-readable; Avalon truncates
            to 200 runes and strips control characters before display. A
            deny without a reason is a malformed response and fails open.

    GameOverEvent:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [room, result]
          properties:
            event:
              const: game.over
            eventVersion:
              const: 1
            room:
              $ref: "#/components/schemas/RoomRef"
            result:
              description: >-
                Null when the engine produced no settlement data (e.g. a
                forced end); the match-end fact is still delivered.
              oneOf:
                - type: "null"
                - type: object
                  required:
                    [mapName, gameTime, allPlayerList, winPlayerList, playerData, replayName]
                  properties:
                    mapName:
                      type: string
                    gameTime:
                      type: integer
                      description: Engine-reported game time in seconds.
                    allPlayerList:
                      type: array
                      items:
                        type: string
                    winPlayerList:
                      type: array
                      items:
                        type: string
                    playerData:
                      type: object
                      description: Player name -> (stat key -> int).
                      additionalProperties:
                        type: object
                        additionalProperties:
                          type: integer
                    replayName:
                      type: string

    PlayerJoinEvent:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [room, player]
          properties:
            event:
              const: player.join
            eventVersion:
              const: 1
            room:
              $ref: "#/components/schemas/RoomRef"
            player:
              $ref: "#/components/schemas/PlayerInfo"

    PlayerLeaveEvent:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [room, player, banRemainingMs, inGame]
          properties:
            event:
              const: player.leave
            eventVersion:
              const: 1
            room:
              $ref: "#/components/schemas/RoomRef"
            player:
              $ref: "#/components/schemas/PlayerInfo"
            banRemainingMs:
              type: integer
              description: >-
                Milliseconds remaining on the rejoin lockout window; > 0
                means the player left with an active kick/ban window. The
                disconnect cause itself (voluntary / kicked / network
                drop) is not obtainable and is not carried.
            inGame:
              type: boolean
              description: Whether the room was mid-match at leave time.

    PlayerActionEvent:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [room, player]
          properties:
            event:
              enum: [player.banned, player.unbanned, player.ipbanned]
            eventVersion:
              const: 1
            room:
              $ref: "#/components/schemas/RoomRef"
            player:
              $ref: "#/components/schemas/PlayerInfo"

    GameStartEvent:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [room, match]
          properties:
            event:
              const: game.start
            eventVersion:
              const: 1
            room:
              $ref: "#/components/schemas/RoomRef"
            match:
              type: object
              description: Room snapshot at match start.
              required: [mapName, mapPlayer, maxPlayers, startTime, players]
              properties:
                mapName:
                  type: string
                mapPlayer:
                  type: string
                  description: Engine map-player descriptor (e.g. "[z;p10]").
                maxPlayers:
                  type: integer
                startTime:
                  type: integer
                  description: >-
                    Unix seconds at match start. 0 in the pre-start veto
                    consultation (the match has not started yet); the
                    actual start time in the post-start observe emission.
                players:
                  type: array
                  items:
                    $ref: "#/components/schemas/PlayerInfo"

    PlayerChatEvent:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [room, player, message]
          properties:
            event:
              const: player.chat
            eventVersion:
              const: 1
            room:
              $ref: "#/components/schemas/RoomRef"
            player:
              $ref: "#/components/schemas/PlayerInfo"
            message:
              type: string
              description: Message text after the built-in filters.

    UnitOperationEvent:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [room, player, action, unitName, x, y]
          properties:
            event:
              const: unit.operation
            eventVersion:
              const: 1
            room:
              $ref: "#/components/schemas/RoomRef"
            player:
              $ref: "#/components/schemas/PlayerInfo"
            action:
              type: string
              description: Order kind name (build/move/attack etc.).
            unitName:
              type: string
            x:
              type: number
            y:
              type: number

    FactoryBuildEvent:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [room, player, actionId]
          properties:
            event:
              const: factory.build
            eventVersion:
              const: 1
            room:
              $ref: "#/components/schemas/RoomRef"
            player:
              $ref: "#/components/schemas/PlayerInfo"
            actionId:
              type: string
              description: Factory build action id (never starts with "_").

    ConnectionNewEvent:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [connection]
          properties:
            event:
              const: connection.new
            eventVersion:
              const: 1
            connection:
              type: object
              description: >-
                Connection-layer identity only. The connection has not
                spoken the game protocol yet; no player identity exists at
                this point and none is carried. No room reference either —
                the connection is not associated with a room yet.
              required: [address, ipLong24, transport]
              properties:
                address:
                  type: string
                  description: Remote IP of the connection.
                ipLong24:
                  type: string
                  description: >-
                    /24 prefix key, same form the built-in IP/24 ban list
                    is keyed on.
                transport:
                  type: string
                  description: Transport identifier (e.g. TCP-NIO).

    PlayerKickedEvent:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [room, player, reason, durationSec]
          properties:
            event:
              const: player.kicked
            eventVersion:
              const: 1
            room:
              $ref: "#/components/schemas/RoomRef"
            player:
              $ref: "#/components/schemas/PlayerInfo"
            reason:
              type: string
              description: >-
                Kick text as issued. Sanitized before emission (control
                characters stripped, truncated to 200 runes).
            durationSec:
              type: integer
              description: >-
                Rejoin lockout in seconds; 0 = kick without a rejoin lock.
