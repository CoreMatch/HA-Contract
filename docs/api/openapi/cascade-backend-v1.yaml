# Provenance (migration header; contract content below is unchanged):
#   source repo:    https://github.com/CoreMatch/Cascade
#   source path:    HA-Contract/openapi/cascade-backend-v1.yaml
#   source commit:  f94f511
#   migrated on:    2026-11-04
#   authority:      From this migration on, HA-Contract is the single source
#                   of truth for the Cascade backend contract. The copy in the
#                   Cascade repository is historical and must not diverge.
openapi: 3.1.0
info:
  title: Cascade Backend Contract
  version: 1.3.0
  description: >-
    Versioned control API between the Cascade proxy and an independent game
    backend. v1.1 (2026-11-04): backend trust strategies (open/ip/pinned;
    JWT signatures are not verified by the backend), /health readiness
    includes a game-core helper where present, and 403 FORBIDDEN answers
    trust-strategy rejections. v1.1.1 (2026-11-04): deployment/operations
    content moved out per repository scope; no interface semantics changed.
    v1.2 (2026-11-05): the proxy derives its transport toward each backend
    from the declared trust strategy (plaintext for open/ip, TLS with a
    client certificate for pinned, safest available transport when the
    declaration is missing or unparseable). v1.2.1 (2026-11-05): coverage
    audit clarifications only (UNSUPPORTED_VERSION reserved, retry scope
    limited to transport failures); no endpoint, field, or response
    semantics changed, so this document carries the contract version for
    traceability only. v1.3 (2026-11-08): read-only room mod manifest and
    mod file endpoints for client-side mod assembly (RW-Mod-Injector);
    additive only, no existing endpoint, field, or response semantics
    changed. See the contract document Changelog
    (docs/dev/Cascade/Cascade-Backend-v1.md).
servers:
  - url: https://backend.example.invalid/v1
# No universal security requirement applies: whether the backend serves TLS
# and how it authenticates the proxy are implementation choices whose
# observable behavior the contract defines (trust strategies).
security: []
paths:
  /health:
    get:
      operationId: getBackendHealth
      responses:
        "200":
          description: >-
            Backend control and game listeners are ready. Since v1.1: if a
            game-core helper is configured on the backend, readiness
            additionally requires the helper to be ready (non-blocking probe;
            the health check must not start the helper). A configured helper
            that failed to load keeps the backend not ready (no silent
            degradation). Backends without a helper are ready once the game
            listener is established.
          content:
            application/json:
              schema:
                type: object
                required: [backendId, status]
                properties:
                  backendId:
                    type: string
                  status:
                    type: string
                    enum: [ready, not_ready]
        "403":
          $ref: "#/components/responses/TrustForbidden"
        "503":
          $ref: "#/components/responses/BackendError"
  /rooms:
    get:
      operationId: listBackendRooms
      responses:
        "200":
          description: Full authoritative ownership snapshot for this backend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSnapshot"
        "403":
          $ref: "#/components/responses/TrustForbidden"
        "503":
          $ref: "#/components/responses/BackendError"
  /sessions/{sessionID}/identity:
    put:
      operationId: bindSessionIdentity
      parameters:
        - $ref: "#/components/parameters/SessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: >-
                    Single-use JWT described in the contract. The proxy signs
                    it with EdDSA; since v1.1 backends do not verify the
                    signature (trust-strategy dependent) but still enforce the
                    structural claims and one-time jti.
      responses:
        "204":
          description: Identity bound, or an exact idempotent retry was accepted.
        "400":
          $ref: "#/components/responses/BackendError"
        "403":
          $ref: "#/components/responses/TrustForbidden"
        "404":
          $ref: "#/components/responses/BackendError"
        "409":
          $ref: "#/components/responses/BackendError"
        "410":
          $ref: "#/components/responses/BackendError"
        "503":
          $ref: "#/components/responses/BackendError"
  /rooms/{code}:
    get:
      operationId: getRoom
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      responses:
        "200":
          description: Room details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomDetail"
        "403":
          $ref: "#/components/responses/TrustForbidden"
        "404":
          $ref: "#/components/responses/BackendError"
    delete:
      operationId: deleteRoom
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      responses:
        "204":
          description: Room deleted.
        "403":
          $ref: "#/components/responses/TrustForbidden"
        "404":
          $ref: "#/components/responses/BackendError"
  /rooms/create:
    post:
      operationId: createRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                title:
                  type: string
                maxPlayers:
                  type: integer
                  minimum: 1
      responses:
        "201":
          description: Room created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSummary"
        "403":
          $ref: "#/components/responses/TrustForbidden"
        "409":
          $ref: "#/components/responses/BackendError"
  /rooms/{code}/settings:
    put:
      operationId: updateRoomSettings
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSummary"
        "403":
          $ref: "#/components/responses/TrustForbidden"
        "404":
          $ref: "#/components/responses/BackendError"
  /rooms/{code}/kick:
    post:
      operationId: kickPlayer
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerAction"
      responses:
        "204":
          description: Player disconnected.
        "403":
          $ref: "#/components/responses/TrustForbidden"
        "404":
          $ref: "#/components/responses/BackendError"
  /rooms/{code}/ban:
    post:
      operationId: banPlayer
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerAction"
      responses:
        "204":
          description: Player banned and disconnected.
        "403":
          $ref: "#/components/responses/TrustForbidden"
        "404":
          $ref: "#/components/responses/BackendError"
  /rooms/{code}/players:
    get:
      operationId: listRoomPlayers
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      responses:
        "200":
          description: Current room players.
          content:
            application/json:
              schema:
                type: object
                required: [players]
                properties:
                  players:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "403":
          $ref: "#/components/responses/TrustForbidden"
        "404":
          $ref: "#/components/responses/BackendError"
  /rooms/{code}/mods:
    get:
      operationId: listRoomMods
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      responses:
        "200":
          description: >-
            Mod manifest of the backend's game-core mod set for this room
            (v1.3). Read-only and player-facing: the manifest carries only
            mod names, safe file names, content hashes, and sizes — no
            player data and no server-internal fields. Content hashes are
            the sole trust basis for client-side assembly; sig/sigAlg are
            reserved for a future publisher signature and are null in v1.3.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomModManifest"
        "403":
          $ref: "#/components/responses/TrustForbidden"
        "404":
          $ref: "#/components/responses/BackendError"
  /rooms/{code}/mods/{file}:
    get:
      operationId: getRoomModFile
      parameters:
        - $ref: "#/components/parameters/RoomCode"
        - $ref: "#/components/parameters/ModFile"
      responses:
        "200":
          description: >-
            Mod file bytes (v1.3). The response body must be exactly the
            bytes whose SHA-256 and size are declared for this file in the
            room mod manifest. Served as an opaque octet stream; the
            backend must not transform the stored file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BackendError"
        "403":
          $ref: "#/components/responses/TrustForbidden"
        "404":
          $ref: "#/components/responses/BackendError"
components:
  securitySchemes:
    # Retained for reference: under the `pinned` trust strategy the backend
    # validates proxy client certificates by SHA-256 fingerprint rather than
    # CA chain; other strategies do not require client certificates.
    mutualTLS:
      type: mutualTLS
  parameters:
    SessionID:
      name: sessionID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoomCode:
      name: code
      in: path
      required: true
      schema:
        type: string
    ModFile:
      name: file
      in: path
      required: true
      description: >-
        Safe file name exactly as declared in the room mod manifest
        (v1.3). Restricted to a whitelist character set; path separators
        are not valid file names, and the bare values "." and ".." are
        rejected. A value outside the whitelist (including "." and "..")
        is INVALID_REQUEST (400); a well-formed value that is not present
        in the manifest is ROOM_NOT_FOUND (404).
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]+$"
  schemas:
    RoomSummary:
      type: object
      required:
        - code
        - title
        - mapName
        - maxPlayers
        - players
        - inGame
        - ownerId
        - ownerName
        - adminCount
        - createdAt
      properties:
        code:
          type: string
        title:
          type: string
        mapName:
          type: string
        maxPlayers:
          type: integer
        players:
          type: integer
        inGame:
          type: boolean
        ownerId:
          type: string
        ownerName:
          type: string
        adminCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      additionalProperties: true
    RoomDetail:
      allOf:
        - $ref: "#/components/schemas/RoomSummary"
        - type: object
          required: [members]
          properties:
            members:
              type: array
              items:
                type: object
                additionalProperties: true
    RoomSnapshot:
      type: object
      required: [backendId, generatedAt, rooms]
      properties:
        backendId:
          type: string
        generatedAt:
          type: string
          format: date-time
        rooms:
          type: array
          items:
            $ref: "#/components/schemas/RoomSummary"
    PlayerAction:
      type: object
      required: [playerId]
      properties:
        playerId:
          type: string
    RoomModManifest:
      type: object
      description: >-
        Mod manifest for a room's backend mod set (v1.3). Assembly clients
        must match installed mods against this manifest by content hash
        only, never by name. sig/sigAlg are reserved for a future publisher
        signature; v1.3 implementations emit null for both — the keys are
        always present (required) with a null value.
      required: [mods, sig, sigAlg]
      properties:
        mods:
          type: array
          items:
            $ref: "#/components/schemas/RoomModEntry"
        sig:
          type:
            - string
            - "null"
          description: Reserved publisher signature; null in v1.3.
        sigAlg:
          type:
            - string
            - "null"
          description: Reserved signature algorithm identifier; null in v1.3.
    RoomModEntry:
      type: object
      required: [name, file, sha256, size]
      properties:
        name:
          type: string
          description: Human-readable mod name (display only; never a key).
        file:
          type: string
          pattern: "^[A-Za-z0-9._-]+$"
          description: >-
            Safe file name used by the content endpoint. Directory-style
            mods are packaged; the served artifact is always a single file.
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: >-
            Lowercase hex SHA-256 of the exact bytes served by the content
            endpoint. Sole trust basis for assembly verification.
        size:
          type: integer
          minimum: 0
          description: Size in bytes of the served file.
  responses:
    BackendError:
      description: Stable backend error response.
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
              message:
                type: string
    TrustForbidden:
      description: >-
        Trust-strategy rejection (v1.1): the request source is not in the
        backend's accepted source allowlist, or the TLS client-certificate
        fingerprint is not accepted. Response body uses the stable error
        shape with code FORBIDDEN. Since the trust check wraps the whole /v1
        surface, any operation may return this response.
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
                enum: [FORBIDDEN]
              message:
                type: string
