# Provenance (migration header; contract content below is unchanged):
#   source repo:    https://github.com/CoreMatch/Cascade
#   source path:    HA-Contract/openapi/cascade-backend-v1.yaml
#   source commit:  f94f511
#   migrated on:    2026-11-04
#   authority:      From this migration on, HA-Contract is the single source
#                   of truth for the Cascade backend contract. The copy in the
#                   Cascade repository is historical and must not diverge.
openapi: 3.1.0
info:
  title: Cascade Backend Contract
  version: 1.1.1
  description: >-
    Versioned control API between the Cascade proxy and an independent game
    backend. v1.1 (2026-11-04): backend trust strategies (open/ip/pinned;
    JWT signatures are not verified by the backend), /health readiness
    includes a game-core helper where present, and 403 FORBIDDEN answers
    trust-strategy rejections. v1.1.1 (2026-11-04): deployment/operations
    content moved out per repository scope; no interface semantics changed.
    See the contract document Changelog
    (docs/dev/Cascade/Cascade-Backend-v1.md).
servers:
  - url: https://backend.example.invalid/v1
# No universal security requirement applies: whether the backend serves TLS
# and how it authenticates the proxy are implementation choices whose
# observable behavior the contract defines (trust strategies).
security: []
paths:
  /health:
    get:
      operationId: getBackendHealth
      responses:
        "200":
          description: >-
            Backend control and game listeners are ready. Since v1.1: if a
            game-core helper is configured on the backend, readiness
            additionally requires the helper to be ready (non-blocking probe;
            the health check must not start the helper). A configured helper
            that failed to load keeps the backend not ready (no silent
            degradation). Backends without a helper are ready once the game
            listener is established.
          content:
            application/json:
              schema:
                type: object
                required: [backendId, status]
                properties:
                  backendId:
                    type: string
                  status:
                    type: string
                    enum: [ready, not_ready]
        "403":
          $ref: "#/components/responses/TrustForbidden"
        "503":
          $ref: "#/components/responses/BackendError"
  /rooms:
    get:
      operationId: listBackendRooms
      responses:
        "200":
          description: Full authoritative ownership snapshot for this backend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSnapshot"
        "403":
          $ref: "#/components/responses/TrustForbidden"
        "503":
          $ref: "#/components/responses/BackendError"
  /sessions/{sessionID}/identity:
    put:
      operationId: bindSessionIdentity
      parameters:
        - $ref: "#/components/parameters/SessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: >-
                    Single-use JWT described in the contract. The proxy signs
                    it with EdDSA; since v1.1 backends do not verify the
                    signature (trust-strategy dependent) but still enforce the
                    structural claims and one-time jti.
      responses:
        "204":
          description: Identity bound, or an exact idempotent retry was accepted.
        "400":
          $ref: "#/components/responses/BackendError"
        "403":
          $ref: "#/components/responses/TrustForbidden"
        "404":
          $ref: "#/components/responses/BackendError"
        "409":
          $ref: "#/components/responses/BackendError"
        "410":
          $ref: "#/components/responses/BackendError"
        "503":
          $ref: "#/components/responses/BackendError"
  /rooms/{code}:
    get:
      operationId: getRoom
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      responses:
        "200":
          description: Room details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomDetail"
        "403":
          $ref: "#/components/responses/TrustForbidden"
        "404":
          $ref: "#/components/responses/BackendError"
    delete:
      operationId: deleteRoom
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      responses:
        "204":
          description: Room deleted.
        "403":
          $ref: "#/components/responses/TrustForbidden"
        "404":
          $ref: "#/components/responses/BackendError"
  /rooms/create:
    post:
      operationId: createRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                title:
                  type: string
                maxPlayers:
                  type: integer
                  minimum: 1
      responses:
        "201":
          description: Room created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSummary"
        "403":
          $ref: "#/components/responses/TrustForbidden"
        "409":
          $ref: "#/components/responses/BackendError"
  /rooms/{code}/settings:
    put:
      operationId: updateRoomSettings
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSummary"
        "403":
          $ref: "#/components/responses/TrustForbidden"
        "404":
          $ref: "#/components/responses/BackendError"
  /rooms/{code}/kick:
    post:
      operationId: kickPlayer
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerAction"
      responses:
        "204":
          description: Player disconnected.
        "403":
          $ref: "#/components/responses/TrustForbidden"
        "404":
          $ref: "#/components/responses/BackendError"
  /rooms/{code}/ban:
    post:
      operationId: banPlayer
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerAction"
      responses:
        "204":
          description: Player banned and disconnected.
        "403":
          $ref: "#/components/responses/TrustForbidden"
        "404":
          $ref: "#/components/responses/BackendError"
  /rooms/{code}/players:
    get:
      operationId: listRoomPlayers
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      responses:
        "200":
          description: Current room players.
          content:
            application/json:
              schema:
                type: object
                required: [players]
                properties:
                  players:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "403":
          $ref: "#/components/responses/TrustForbidden"
        "404":
          $ref: "#/components/responses/BackendError"
components:
  securitySchemes:
    # Retained for reference: under the `pinned` trust strategy the backend
    # validates proxy client certificates by SHA-256 fingerprint rather than
    # CA chain; other strategies do not require client certificates.
    mutualTLS:
      type: mutualTLS
  parameters:
    SessionID:
      name: sessionID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoomCode:
      name: code
      in: path
      required: true
      schema:
        type: string
  schemas:
    RoomSummary:
      type: object
      required:
        - code
        - title
        - mapName
        - maxPlayers
        - players
        - inGame
        - ownerId
        - ownerName
        - adminCount
        - createdAt
      properties:
        code:
          type: string
        title:
          type: string
        mapName:
          type: string
        maxPlayers:
          type: integer
        players:
          type: integer
        inGame:
          type: boolean
        ownerId:
          type: string
        ownerName:
          type: string
        adminCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      additionalProperties: true
    RoomDetail:
      allOf:
        - $ref: "#/components/schemas/RoomSummary"
        - type: object
          required: [members]
          properties:
            members:
              type: array
              items:
                type: object
                additionalProperties: true
    RoomSnapshot:
      type: object
      required: [backendId, generatedAt, rooms]
      properties:
        backendId:
          type: string
        generatedAt:
          type: string
          format: date-time
        rooms:
          type: array
          items:
            $ref: "#/components/schemas/RoomSummary"
    PlayerAction:
      type: object
      required: [playerId]
      properties:
        playerId:
          type: string
  responses:
    BackendError:
      description: Stable backend error response.
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
              message:
                type: string
    TrustForbidden:
      description: >-
        Trust-strategy rejection (v1.1): the request source is not in the
        backend's accepted source allowlist, or the TLS client-certificate
        fingerprint is not accepted. Response body uses the stable error
        shape with code FORBIDDEN. Since the trust check wraps the whole /v1
        surface, any operation may return this response.
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
                enum: [FORBIDDEN]
              message:
                type: string
