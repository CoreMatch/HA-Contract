openapi: 3.1.0
info:
  title: HA-Cupbearer API
  version: 1.7.0
  description: >
    Contract for the HA-Cupbearer HTTP surface. The service has three
    roles: (1) a read-only delivery service for the version manifest and
    release artifacts (the original scope), (2) an opt-in bare-metal
    orchestrator that drives Tinyvisor on the target machine (config v2,
    `orchestration.enabled: true`), and (3) a first-run bootstrap layer that
    turns a fresh machine into a runnable platform without manual secret
    generation, database creation or `.env` assembly (config v3).

    Response envelope: every endpoint answers
    `{"success": bool, "message": string, "data": {...}}`; error bodies may
    carry an `error` string field. The delivery surface is unauthenticated
    and loopback-bound by default in composed deployments; the orchestration
    and bootstrap mutating endpoints are guarded by a shared deploy token
    (see security).

    Deploy and rollback runs are gated by a one-pass preflight check
    (`GET /api/v1/deploy/preflight`): every checkable condition is evaluated
    up front and reported graded into blockers (run refused, 400 with the
    full report) and warnings (run proceeds). Each finding carries the
    concrete path/port/address it is about.

    The bootstrap layer (`/api/v1/deploy/bootstrap/*`) is independent of
    `orchestration.enabled`: it is available whenever the service runs. Its
    mutating endpoints (plan/run) still fail closed on X-Deploy-Token. All
    generated values are masked or fingerprinted in every response, plan and
    run record — plaintext secrets never appear in this API surface. Bootstrap
    runs are idempotent: existing values/files/databases are preserved, drift
    only warns, and re-running is the resume mechanism (per-step records).

    The Cupbearer supervises one MaintenanceView instance
    (`GET /api/v1/deploy/maintenance-view`): it reuses an already-running
    instance or starts and supervises a child process with auto-derived
    configuration (cupbearer address, port, deploy token held server-side).
    Semantics are normative in HA-Cupbearer
    `knowledge/0015-first-run-bootstrap-and-mv-autostart.md`.

    Orchestration semantics (version dirs + `current` symlink, dependency
    ordering, idempotent re-runs as resume, failure isolation, one-click
    rollback, `manager != tinyvisor` projects treated foreign/read-only) are
    normative in HA-Cupbearer `knowledge/0007-bare-metal-orchestration-scope.md`.

    Bare-metal artifact sources (deploy-manifest.yaml
    `baremetal.artifact.source`): `local_path` (same-machine file + `.sha256`
    sidecar), `ci_release` (GitHub Release double asset), and since contract
    1.4.0 `grail` — fetch from a Grail upstream declared per manifest as
    `grail: {base_url, project, channel, version, platform}`. The Grail
    source resolves the signed version manifest, verifies the origin
    signature chain against a locally pinned Grail root public key (held in
    the Cupbearer credentials file, never in the manifest), then streams the
    bytes from the canonical URL under digest verification. The Grail
    surface itself is contracted in `openapi/grail.yaml`. This HTTP surface
    (routes) is unchanged by the new source; the version bump records the
    manifest schema extension.

    Since contract 1.5.0 the aggregated manifests view additionally reports
    each project's declared bare-metal artifact source (`artifact_source`),
    so an operations wizard can show and sanity-check source declarations
    without parsing manifest files. The field is additive (empty string for
    external-kind projects or undeclared sources); routes, authentication
    and all pre-existing fields are unchanged.

    Since contract 1.6.0 the bootstrap databases step probes before it acts
    and resolves conflicts explicitly. Plan and run inputs accept
    `database.policy` — `takeover` (alter the pre-existing app account's
    password to this run's credential), `reuse` (keep the account's password
    and continue with the operator-provided `database.existing_password`,
    adopted into state), or `skip` (leave the databases step untouched,
    complete the remaining steps) — plus `database.existing_password`
    (required by `reuse`, never echoed; masked discipline applies). The
    policy only takes effect when the app account already exists and the
    run's candidate credential does not verify against it: without a policy
    such a conflict fails the run loud (400-style step failure / plan
    blocker), never half-applied. Matching credentials stay a no-op
    (idempotent re-run), and when no conflict exists the policy is ignored
    (creation proceeds as before). Plans report the probe outcome (database
    and account existence, credential match) as items, so a wizard can show
    "what already exists, what was chosen, what happened".

    Since contract 1.7.0 the bootstrap surface adds a read-only credential
    prefill hints endpoint (`POST /api/v1/deploy/bootstrap/credential-hints`,
    deploy-token gated, fail-closed): when adopting or reusing a pre-existing
    MySQL/Redis/app-account, the wizard may prefill the password fields with
    values this tool itself generated and can still trace. Three source
    classes are consulted in order — managed container env, this instance's
    bootstrap state and the `.env` it wrote, and historical on-machine
    artifacts of earlier instances of this tool (bounded scan roots, never a
    filesystem walk). Every candidate is verified against the target account
    before its plaintext is echoed; untraceable (external) passwords are
    never prefilled and never echoed, and every plaintext echo is audit-logged
    server-side (caller, target, source, provenance, fingerprint, time — no
    plaintext in the audit record). `database.existing_password` keeps its
    `policy: reuse` semantics unchanged; the hints are additive read-only
    fields carrying a `source` enum and a `provenance` description.
servers:
  - url: /

security: []

paths:
  /healthz:
    get:
      summary: Liveness probe
      description: Returns 200 with service name and current time. No auth.
      responses:
        '200':
          description: Service is alive

  /api/v1/healthz:
    get:
      summary: Liveness probe (API alias)
      description: Identical to /healthz. No auth.
      responses:
        '200':
          description: Service is alive

  /api/v1/manifest:
    get:
      summary: Version manifest
      description: >
        Returns the version manifest loaded from `manifest.path` (manifest v1
        schema, validated on every request; a missing file yields an empty
        manifest). No auth.
      responses:
        '200':
          description: Manifest loaded
        '500':
          description: Manifest file present but unreadable or invalid

  /api/v1/projects:
    get:
      summary: Binary-only projection of the manifest
      description: >
        Projects view of the manifest consumed by HA-Services-MaintenanceView.
        No auth.
      responses:
        '200':
          description: Projects loaded
        '500':
          description: Manifest file present but unreadable or invalid

  /api/v1/artifacts/{service}/{filepath}:
    get:
      summary: Download a release artifact
      description: >
        Serves files from `storage.artifacts_root/<service>/<filepath>` with a
        path-traversal guard. No auth; firewall the port (loopback-bound by
        default in composed deployments). sha256 is NOT verified server-side
        (knowledge/0003); content identity is a consumer-side duty.
      parameters:
        - name: service
          in: path
          required: true
          schema: { type: string }
        - name: filepath
          in: path
          required: true
          description: gin catch-all (`*filepath`); may contain slashes.
          schema: { type: string }
      responses:
        '200':
          description: Artifact file
        '400':
          description: Invalid artifact path (traversal attempt)
        '404':
          description: Artifact not found

  /api/v1/deploy/manifests:
    get:
      summary: Aggregated deploy manifests
      description: >
        Lists every `deploy-manifest.yaml` aggregated from
        `orchestration.scan_roots` plus external manifests. Read-only.
        Returns 503 when orchestration is disabled.
      responses:
        '200':
          description: >
            Aggregated manifests with load errors. Data: `count`, `projects`
            (per project: `project`, `kind`, `display_name`, `group`,
            `service_version`, `manager`, `source_path`, and since 1.5.0
            `artifact_source` — the declared `baremetal.artifact.source`
            (`local_path` | `ci_release` | `grail`), empty for external-kind
            projects or when undeclared), `errors`.
        '503':
          description: Orchestration disabled

  /api/v1/deploy/validate:
    get:
      description: >
        Aggregate validation report (schema, duplicate projects, dependency
        existence, dependency cycles, cross-project port conflicts). Read-only.
      summary: Manifest validation report
      responses:
        '200':
          description: Validation report (`ok` + `errors`)
        '503':
          description: Orchestration disabled

  /api/v1/deploy/status:
    get:
      summary: Declared vs. live status
      description: >
        Per-project declared version, active version (symlink target),
        Tinyvisor liveness and a passive HTTP health probe. Strictly
        read-only: foreign (`manager != tinyvisor`) projects are never
        touched. Returns 503 when orchestration is disabled.
      responses:
        '200':
          description: Status report
        '503':
          description: Orchestration disabled

  /api/v1/deploy/preflight:
    get:
      summary: Deployment preflight check
      description: >
        Runs every deploy-time check up front in one pass and reports the
        results graded into blockers (a run would be refused) and warnings
        (a run may proceed, with risk): install-root / version-dir
        writability, `current` symlink shape, workdir, env-file existence
        and readability, Tinyvisor reachability + apiKey validity, target
        port occupancy (the project's own running process is skipped), disk
        space against the artifact size, and declared dependency
        reachability. Every finding carries the concrete path/port/address.
        Strictly read-only; not subject to single-flight (may run while a
        run is in progress). Query `projects` (comma-separated) and/or
        `group` to scope the check; empty means all projects.
      parameters:
        - name: projects
          in: query
          required: false
          schema: { type: string }
        - name: group
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Preflight report (graded blockers/warnings)
        '400':
          description: Aggregate validation failed or bad scope
        '503':
          description: Orchestration disabled

  /api/v1/deploy/runs:
    get:
      summary: Orchestration run history
      description: Summaries of all recorded runs (deploy/rollback). Read-only.
      responses:
        '200':
          description: Run summaries
        '503':
          description: Orchestration disabled

  /api/v1/deploy/runs/{id}:
    get:
      summary: Single run record
      description: Full run record including per-project steps (resume basis).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Run record
        '404':
          description: Run not found
        '503':
          description: Orchestration disabled

  /api/v1/deploy/run:
    post:
      summary: Start an orchestration deploy run
      description: >
        Validates the aggregate (refuses on any error), runs the one-pass
        preflight (same checks as GET /api/v1/deploy/preflight; any blocker
        refuses the run with 400 carrying the full graded report), plans by
        dependency order, then asynchronously executes the per-project
        pipeline (artifact+sha256 -> version dir -> symlink -> Tinyvisor
        script upsert -> restart -> health probe -> post-deploy smoke
        verification when `facts.smoke` is declared, with auto-rollback on
        failed health or smoke). Smoke checks are real requests proving the
        service actually works (health only proves liveness); a failed
        smoke is a failed deploy and takes the same auto-rollback path.
        Smoke secrets are referenced as `${secret:<name>}` and resolved
        from the orchestrator's credentials file — never stored in
        manifests. The passing preflight report is stored on the run
        record. dry_run applies the same preflight gate (blockers refused)
        and records the report plus planned steps without executing.
        Single-flight: a second concurrent run is rejected. Re-running is
        the resume mechanism (healthy up-to-date projects are no-ops).
        Auth: X-Deploy-Token (fail-closed; 503 when no token is configured).
      security:
        - deployToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                projects:
                  type: array
                  items: { type: string }
                group: { type: string }
                dry_run: { type: boolean }
                auto_rollback_on_fail: { type: boolean }
      responses:
        '202':
          description: Run started (returns run id, planned order, preflight report)
        '400':
          description: Validation failed, preflight blocked, or bad scope
        '401':
          description: Invalid or missing X-Deploy-Token
        '409':
          description: A run is already in progress
        '503':
          description: Orchestration disabled or deploy token not configured

  /api/v1/deploy/rollback:
    post:
      summary: One-click rollback
      description: >
        Switches `current` back to the previous release (or `to` when given),
        restarts via Tinyvisor and re-probes health; when `facts.smoke` is
        declared the rolled-back version is smoke-verified too (a failed
        smoke marks the rollback run failed with the detail, the symlink
        stays on the target). `cascade` also restarts direct required
        dependents. Refused for foreign projects. Gated by the preflight in
        rollback mode (no artifact/disk checks; any blocker refuses with
        400 carrying the full graded report).
        Auth: X-Deploy-Token (fail-closed).
      security:
        - deployToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project]
              properties:
                project: { type: string }
                to: { type: string }
                cascade: { type: boolean }
      responses:
        '202':
          description: Rollback started
        '400':
          description: >
            Unknown project, foreign project, no previous release, or
            preflight blocked
        '401':
          description: Invalid or missing X-Deploy-Token
        '409':
          description: A run is already in progress
        '503':
          description: Orchestration disabled or deploy token not configured

  /api/v1/deploy/container/trigger:
    post:
      summary: One-click container stack trigger
      description: >
        The default container-path interaction. Generates a compose override
        pinning each project's published registry image reference
        (digest-first: `repo@sha256:<manifest list digest>`; tag-only when
        no digest is declared), layers it over the platform compose template
        (`orchestration.container.compose_file`, default
        `deploy/docker-compose.yml`) and executes `docker compose up -d`,
        reporting the result faithfully (run type `container-trigger`,
        queryable via GET /api/v1/deploy/runs/{id}). The full container
        lifecycle (creation, network, healthchecks, restart policy) is
        handled by compose; the orchestrator does not do per-container
        management on this path. Manifests declaring a published reference
        with no matching template service, and template services with no
        published reference, are recorded in the run notes — never silently.
        Single-flight is shared with deploy/rollback runs.
        Auth: X-Deploy-Token (fail-closed).
      security:
        - deployToken: []
      responses:
        '202':
          description: Container trigger started (returns the run snapshot)
        '400':
          description: Manifest validation failed; trigger refused
        '401':
          description: Invalid or missing X-Deploy-Token
        '409':
          description: A run is already in progress
        '503':
          description: Orchestration disabled or deploy token not configured

  /api/v1/deploy/bootstrap/status:
    get:
      summary: First-run bootstrap status and wizard metadata
      description: >
        Read-only view of the bootstrap layer, independent of
        `orchestration.enabled`. Reports whether the bootstrap state file
        exists, which generated values are already present (names plus
        sha256 fingerprints only — never plaintext), which artifacts exist
        on disk (`.env`, signing keys, rendered configs), whether the deploy
        token is configured, and the defaults/prefills the wizard uses
        (client ids, database names, template inventory, manifest-derived
        bare-metal output paths). No auth (read-only, no secrets in output).
      responses:
        '200':
          description: Bootstrap status and wizard metadata

  /api/v1/deploy/bootstrap/infra:
    get:
      summary: MySQL/Redis infrastructure status
      description: >
        Read-only probe of the MySQL/Redis instances managed by this layer.
        Infrastructure stands per selected deployment path: bare-metal
        orchestration connects via host address + published port; container
        orchestration connects via service name + container port. For each
        instance reports the mode (`container` managed by this layer,
        `external` adopted/reused, or `absent`), health, image, data volume,
        and both connection forms. Never starts anything. No auth.
      responses:
        '200':
          description: Infrastructure status for mysql and redis

  /api/v1/deploy/bootstrap/infra/mysql:
    post:
      summary: One-click ensure MySQL is available
      description: >
        Detects, adopts, or launches the MySQL so it is genuinely
        usable before returning. Reuses an already-healthy managed container
        or an existing reachable instance (never starts a duplicate); when
        nothing is available it launches the managed container (named volume
        persistence, generated root password recorded only as a fingerprint)
        and waits until a query can be executed. Port conflicts and
        adopt-but-no-credential cases are refused with human-readable
        messages. Idempotent. Derived admin connection facts are applied to
        the subsequent database-creation step.
        Auth: X-Deploy-Token (fail-closed).
      security:
        - deployToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                infra:
                  type: object
                  properties:
                    mysql_host_port: { type: integer }
      responses:
        '200':
          description: MySQL ready (returns the instance facts)
        '400':
          description: >
            Port conflict, external instance without credentials, or launch
            failure — human-readable message
        '401':
          description: Invalid or missing X-Deploy-Token
        '503':
          description: Deploy token not configured

  /api/v1/deploy/bootstrap/infra/redis:
    post:
      summary: One-click ensure Redis is available
      description: >
        Same semantics as the MySQL endpoint but for Redis: detect/adopt or
        launch the managed container (named volume, generated password
        fingerprint-only) and wait until PING succeeds. Idempotent.
        Auth: X-Deploy-Token (fail-closed).
      security:
        - deployToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                infra:
                  type: object
                  properties:
                    redis_host_port: { type: integer }
      responses:
        '200':
          description: Redis ready (returns the instance facts)
        '400':
          description: Port conflict or launch failure — human-readable message
        '401':
          description: Invalid or missing X-Deploy-Token
        '503':
          description: Deploy token not configured

  /api/v1/deploy/bootstrap/credential-hints:
    post:
      summary: Credential prefill hints for adopting pre-existing instances
      description: >
        Read-only credential discovery for the "adopt/reuse a pre-existing
        instance" wizard branches (contract 1.7.0). For each of the three
        credential targets — the MySQL admin account (`mysql_admin`), the app
        DB account (`app_user`), and Redis (`redis`) — the layer collects
        candidate values from traceable source classes only, verifies every
        candidate against the target account/instance named by the inputs,
        and echoes plaintext ONLY for the first candidate that verifies.
        Source classes (enum `source`, consulted in this order):
        `managed_container_env` (env of the managed infra containers
        `ha-infra-mysql-1` / `ha-infra-redis-1`, and of compose-managed
        platform service containers declaring the matching account),
        `bootstrap_state` (this instance's bootstrap state), `env_file` (the
        `.env` this instance writes; only keys demonstrably appended by this
        tool qualify — pre-existing keys are treated external), `historical`
        (other on-machine artifacts produced by this tool — `.env` files and
        bootstrap state copies under a bounded root set: an explicit
        scan-root list plus compose working directories of running
        containers; never a filesystem walk; the provenance names the
        directory and, for state copies, the initialization time), and
        `none` (nothing traceable found). Security boundary: passwords this
        tool did not generate and cannot trace are never prefilled and never
        echoed; candidates failing verification are discarded (counted in
        `candidates_checked`, never returned). Every plaintext echo is
        audit-logged server-side (caller address, target, source,
        provenance, value fingerprint, timestamp; the audit record carries
        no plaintext). Writes nothing. `database.existing_password`
        semantics are unchanged (operator-provided input for
        `policy: reuse`); this surface is additive.
      security:
        - deployToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: >
                Partial bootstrap inputs naming the verification targets;
                missing fields fall back to the bootstrap defaults
                (127.0.0.1:3306 root / app user `hrpa`, 127.0.0.1:6379).
              properties:
                database:
                  type: object
                  properties:
                    admin_host: { type: string }
                    admin_port: { type: integer }
                    admin_user: { type: string }
                    app_user: { type: string }
                redis:
                  type: object
                  properties:
                    host: { type: string }
                    port: { type: integer }
      responses:
        '200':
          description: >
            Credential hints report. Data: `generated_at`, `hints` — one
            entry per target with `target`, `account`, `address`, `found`,
            `source`, `value` (present only when found, i.e. traceable and
            verified), `provenance` (which container / file / directory /
            initialization the value came from), `candidates_checked`, and
            `detail` (human-readable situation, including the contextual
            guidance for the managed-but-unreadable and external-instance
            cases when nothing traceable was found).
        '401':
          description: Invalid or missing X-Deploy-Token
        '503':
          description: Deploy token not configured or bootstrap layer absent

  /api/v1/deploy/bootstrap/plan:
    post:
      summary: Bootstrap dry-run (preview)
      description: >
        Validates the provided inputs (missing required values are refused
        with 400 carrying per-field human-readable messages) and returns the
        full plan without writing anything: per-step items naming what would
        be generated, written where, and what already exists and would be
        skipped or warned about. Generated values appear only masked with a
        fingerprint. Available regardless of `orchestration.enabled`.
        Auth: X-Deploy-Token (fail-closed; 503 when no token is configured).
      security:
        - deployToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapInputs'
      responses:
        '200':
          description: Plan computed (nothing written)
        '400':
          description: >
            Invalid or incomplete inputs; the data section carries per-field
            human-readable messages
        '401':
          description: Invalid or missing X-Deploy-Token
        '503':
          description: Deploy token not configured

  /api/v1/deploy/bootstrap/run:
    post:
      summary: Start a bootstrap run (one-click initialization)
      description: >
        Validates inputs like plan, then asynchronously applies the bootstrap
        steps: generate-and-persist secrets (super client, five service
        client pairs, manage token, ops tokens, app DB password), create
        databases and the app DB account (idempotent statements), generate
        the RSA signing key pair, merge the container `.env` (existing
        values preserved, missing appended), and render the bare-metal
        config templates to their output paths (existing files never
        overwritten). Every step is idempotent and recorded; re-running is
        the resume mechanism (completed steps report reused/skipped). The
        run record masks every generated value. Single-flight: a second
        concurrent run is rejected.
        Auth: X-Deploy-Token (fail-closed).
      security:
        - deployToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapInputs'
      responses:
        '202':
          description: Bootstrap run started (returns the run snapshot)
        '400':
          description: Invalid or incomplete inputs
        '401':
          description: Invalid or missing X-Deploy-Token
        '409':
          description: A bootstrap run is already in progress
        '503':
          description: Deploy token not configured

  /api/v1/deploy/bootstrap/runs:
    get:
      summary: Bootstrap run history
      description: >
        Summaries of all recorded bootstrap runs. Read-only; all values
        masked. No auth.
      responses:
        '200':
          description: Run summaries

  /api/v1/deploy/bootstrap/runs/{id}:
    get:
      summary: Single bootstrap run record
      description: >
        Full bootstrap run record including per-step results (resume basis).
        All generated values masked or fingerprinted. No auth.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Run record
        '404':
          description: Run not found

  /api/v1/deploy/maintenance-view:
    get:
      summary: Supervised MaintenanceView status
      description: >
        Read-only status of the MaintenanceView instance the Cupbearer
        supervises: mode (`managed` child process, `reused` already-running
        instance, `disabled`, or `unavailable` with the reason), listen
        address, pid, health, and the binary path in use. The Cupbearer
        reuses an already-healthy instance at the configured address and
        never starts a second one; otherwise it starts the binary with
        auto-derived configuration (cupbearer address, port, deploy token
        held server-side, loopback session trust) and supervises it
        (bounded restarts, graceful stop on shutdown). No auth.
      responses:
        '200':
          description: MaintenanceView supervision status

components:
  schemas:
    CredentialHint:
      type: object
      description: >
        One credential prefill hint (read-only, additive; contract 1.7.0).
        `value` appears only when a traceable candidate verified against the
        target account; `source` names the source class and `provenance` the
        concrete container/file/directory (and initialization time for
        historical state copies). Plaintext echoes are audit-logged
        server-side; the audit record carries no plaintext.
      required: [target, found, source]
      properties:
        target:
          type: string
          enum: [mysql_admin, app_user, redis]
        account:
          type: string
          description: The account the credential belongs to (root / hrpa / empty for Redis).
        address:
          type: string
          description: The verification target address (host:port).
        found:
          type: boolean
        source:
          type: string
          enum: [managed_container_env, bootstrap_state, env_file, historical, none]
        value:
          type: string
          description: >
            Plaintext credential. Present ONLY when `found` — i.e. generated
            or adopted by this tool, traceable, and verified against the
            target account. Never present for external/unverifiable values.
        provenance:
          type: string
          description: >
            Where the value came from, in human terms (container name and
            env key, state file path, `.env` path, or historical directory
            plus initialization time).
        candidates_checked:
          type: integer
          description: How many traceable candidates were tried (verified or not).
        detail:
          type: string
          description: >
            Human-readable situation, including the contextual guidance shown
            when nothing traceable was found (managed-but-unreadable vs
            external-instance).
    CredentialHintsReport:
      type: object
      description: Credential prefill hints report (contract 1.7.0).
      properties:
        generated_at:
          type: string
        hints:
          type: array
          items:
            $ref: '#/components/schemas/CredentialHint'
    BootstrapInputs:
      type: object
      description: >
        The unified bootstrap input. Only values no backend can derive are
        required from the operator (database admin connection, public URLs);
        everything else has defaults and every secret is generated. Missing
        required values are refused per-field with human-readable messages.
      properties:
        targets:
          type: object
          properties:
            container:
              type: boolean
              description: Merge the container `.env` and generate signing keys.
            baremetal:
              type: boolean
              description: Render config templates to bare-metal output paths.
        infra:
          type: object
          description: >
            MySQL/Redis handling. When the admin password is omitted
            and launch is allowed, the run launches the managed containers and
            generates the credentials itself; existing reachable instances are
            adopted instead (never duplicated).
          properties:
            launch:
              type: boolean
              description: Allow launching containers when nothing is available (default true).
            mysql_host_port: { type: integer }
            redis_host_port: { type: integer }
        database:
          type: object
          properties:
            admin_host: { type: string }
            admin_port: { type: integer }
            admin_user: { type: string }
            admin_password: { type: string }
            app_user:
              type: string
              description: Defaults to `hrpa`; password is generated.
            manage_user:
              type: boolean
              description: >
                Create the app user and grant it (default true). Set false
                when an existing app user only needs database creation.
            policy:
              type: string
              enum: [takeover, reuse, skip]
              description: >
                Disposition for a pre-existing app account whose password
                does not verify against this run's candidate credential:
                `takeover` alters the account's password to this run's
                credential and continues; `reuse` keeps the account's
                password and continues with `existing_password` (adopted
                into state); `skip` leaves the entire databases step
                untouched and completes the remaining steps. Only takes
                effect when the probe actually detects that conflict —
                matching credentials stay a no-op and creation proceeds as
                before when nothing pre-exists. Without a policy a detected
                conflict fails the run loud (never half-applied).
            existing_password:
              type: string
              description: >
                The pre-existing app account's current password; required
                with `policy: reuse`, never echoed (masked discipline
                applies).
            names:
              type: object
              description: >
                Database names, defaults hrpa / ygg / haskinlib /
                matchcorearena.
              properties:
                hrpauth: { type: string }
                ygg: { type: string }
                haskinlib: { type: string }
                mca: { type: string }
        redis:
          type: object
          properties:
            host: { type: string }
            port: { type: integer }
            password: { type: string }
            db: { type: integer }
        public_urls:
          type: object
          properties:
            hrpauth: { type: string }
            frontend: { type: string }
            ygg: { type: string }
            haskinproxy: { type: string }
            winnerproxy: { type: string }
            maintenanceview: { type: string }
        internal_urls:
          type: object
          description: >
            Optional overrides for intra-host discovery URLs; defaults derive
            from the compose conventions (container) or 127.0.0.1 with the
            declared ports (bare-metal).
          properties:
            hrpauth: { type: string }
            ygg: { type: string }
            cupbearer: { type: string }
        smtp:
          type: object
          description: Optional; empty leaves mail unsent but services start.
          properties:
            host: { type: string }
            port: { type: integer }
            username: { type: string }
            password: { type: string }
            from_email: { type: string }
        client_ids:
          type: object
          description: >
            Optional overrides; defaults follow the presence-name conventions
            (super `hrpauth-internal-super`, public `hrpauth-webui`,
            `WinnerProxy`, `HRPAuth-Yggdrasil-API`, `HASkinProxy`,
            `hrpauth-webui-sdkhandler`, `haskinlib`).
          properties:
            super: { type: string }
            public: { type: string }
            winnerproxy: { type: string }
            ygg: { type: string }
            haskinproxy: { type: string }
            sdkhandler: { type: string }
            haskinlib: { type: string }
        paths:
          type: object
          properties:
            env_file:
              type: string
              description: Defaults to `deploy/.env`.
            secrets_dir:
              type: string
              description: Defaults to `deploy/secrets`.
            baremetal_outputs:
              type: object
              description: >
                Per-service rendered-config output paths (bare-metal target);
                wizard prefills from manifests when available.
              additionalProperties: { type: string }
  securitySchemes:
    deployToken:
      type: apiKey
      in: header
      name: X-Deploy-Token
      description: >
        Shared deploy token held in the orchestrator's local credentials file
        (never in the repository). Forwarded server-side by the ops panel
        (HA-Services-MaintenanceView); browsers never see it. Mutating
        endpoints fail closed (503) when the token is not configured.
