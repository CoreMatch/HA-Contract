openapi: 3.1.0
info:
  title: HASkinProxy Business API
  version: 1.0.0
  description: >
    Unified specification for the HASkinProxy HTTP surface. HASkinProxy is a
    protocol-translation edge service that bridges the HA skin backend
    (HRPAuth + HRPAuth-Yggdrasil-API, reached through the core's
    `/yggdrasil-api` relay) to CustomSkinLoader (CSL) compatible clients.

    Error shape: HASkinProxy does NOT use the HA unified response envelope.
    CSL endpoints follow CustomSkinLoader conventions (bare JSON / bare
    status codes), and failures use a bare `{"error": "<reason>"}` object.
    This deviation is intentional for launcher/mod compatibility.

    Authentication: the CSL read surface is unauthenticated (launchers fetch
    it anonymously). `POST /{username}/texture/delete` forwards the caller's
    `Authorization` header unchanged to the upstream; HASkinProxy itself
    performs no authentication.
servers:
  - url: /
paths:
  /health:
    get:
      summary: Liveness probe
      description: >
        Returns `200` with `{"status": "ok"}` (bare JSON, not the unified
        envelope). No upstream or cache access.
      responses:
        '200':
          description: Service is alive
  /{username}:
    get:
      summary: CSL profile lookup (CustomSkinLoader)
      description: >
        The path value MUST end with `.json` (CSL convention, e.g.
        `/SomePlayer.json`); any other value answers a bare `404` with an
        empty body. Resolves the username to an HA profile through the
        upstream (username -> UUID -> profile), decodes the Yggdrasil
        textures property, and answers the CSL profile shape. Results are
        cached in-process for the configured profile TTL.

        Texture keys: the skin is filed under its model (`default`, or
        `slim` when the skin metadata says so); cape and elytra are filed
        under `cape` / `elytra` when present. Values are the texture hash
        (the last path segment of the HA texture URL), resolvable via
        `GET /textures/{hash}`.
      parameters:
        - in: path
          name: username
          required: true
          schema: { type: string }
          description: Player name with a mandatory `.json` suffix
      responses:
        '200':
          description: CSL profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSLProfile'
        '404':
          description: >
            Path without the `.json` suffix (empty body), or the username is
            unknown to HA / has no profile (`{"error": "<reason>"}`)
  /textures/{hash}:
    get:
      summary: Pull a texture by hash
      description: >
        Serves the texture bytes for a hash taken from a CSL profile. Warm
        cache entries are served with `X-Cache: HIT`; misses are fetched
        from the upstream texture endpoint, cacheable for the configured
        texture TTL. `Content-Type`, `Last-Modified` and `Cache-Control`
        are forwarded from the upstream when present (Content-Type defaults
        to `image/png`).
      parameters:
        - in: path
          name: hash
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Texture bytes
          headers:
            X-Cache:
              description: '`HIT` when served from the local cache.'
              schema: { type: string }
          content:
            image/png:
              schema: { type: string, format: binary }
        '404':
          description: Hash unknown to the upstream (empty body)
  /{username}/texture/delete:
    post:
      summary: Delete a profile texture binding (CSL-facing passthrough)
      description: >
        Accepts the legacy CSL delete body and maps it onto the upstream
        route `DELETE /texture/delete/{uuid}/{type}` registered by
        HRPAuth-Yggdrasil-API: `profile_id` becomes the `{uuid}` path
        segment and `texture_type` the `{type}` segment. The caller's
        `Authorization` header is forwarded unchanged; HASkinProxy does not
        authenticate the call itself (the upstream validates the Bearer
        token and profile ownership). The upstream status code and response
        body are passed through verbatim (Content-Type forced to
        `application/json`); non-2xx upstream answers (the upstream's own
        `401` / `403` / `500`) are forwarded the same way. On a 2xx upstream
        answer the local profile cache entry for `username` and the cached
        texture entries it references are evicted; the `username` path
        segment is used ONLY for this cache eviction.

        Local validation failures (before any upstream call) answer
        `400 {"error": ...}`: `username required`, `cannot read body`,
        `invalid JSON body`, or `profile_id and texture_type are required`.
        A transport failure toward the upstream answers
        `502 {"error": "<reason>"}`.
      parameters:
        - in: path
          name: username
          required: true
          schema: { type: string }
          description: Used only to evict local cache entries on success
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id, texture_type]
              properties:
                profile_id:
                  type: string
                  description: Profile UUID; mapped to the upstream `{uuid}` path segment
                texture_type:
                  type: string
                  description: >
                    Texture slot forwarded as the upstream `{type}` path
                    segment (`skin` or `cape`); any other legacy body fields
                    are ignored.
      responses:
        '200':
          description: Upstream 2xx answer passed through verbatim
        '400':
          description: >
            Local validation failure: `{"error": "username required"}`,
            `{"error": "cannot read body"}`, `{"error": "invalid JSON body"}`,
            or `{"error": "profile_id and texture_type are required"}`
        '502':
          description: '`{"error": "<reason>"}` (upstream transport failure)'
components:
  schemas:
    CSLProfile:
      type: object
      required: [username]
      properties:
        username:
          type: string
          description: Player name as recorded in the HA profile
        textures:
          type: object
          additionalProperties:
            type: string
          description: >
            Texture map keyed by slot/model: `default` or `slim` (skin),
            `cape`, `elytra`; values are texture hashes resolvable via
            `GET /textures/{hash}`. The key is always present in the
            serialized profile but the map itself is omitted when the
            profile carries no decodable textures (Go `omitempty` on the
            map), so consumers must treat it as optional.
        skin:
          type: string
          description: >
            Legacy CustomSkinAPI flat texture field (texture hash). Part of
            the CSL surface modeled by the response struct
            (`internal/model/csl.go::CSLProfile`); the current handler fills
            only the `textures` map, so this field is omitted in practice.
        cape:
          type: string
          description: Legacy CustomSkinAPI flat cape field; omitted in practice (see `skin`).
        elytra:
          type: string
          description: Legacy CustomSkinAPI flat elytra field; omitted in practice (see `skin`).
