openapi: 3.1.0
info:
  title: HASkinLib Business API
  version: 1.1.0
  description: >
    Unified specification for HASkinLib business interfaces. Rebuilt
    2026-11-04 from the current implementation (the previous version of this
    file was removed in HA-Contract commit badff2a, 2026-10-07).

    1.1.0 (2026-11-12): `GET /profile/textures` confirmed by the author as
    part of the contract surface (previously shelved). Its `data` envelope is
    specified as `{uid, items[]}` to match the implementation, and the `type`
    query parameter is documented.

    Authentication model: HASkinLib has no local credential store. Endpoints
    marked with BearerAuth validate the OAuth2 access token by calling the
    HRPAuth core service (`POST /internal/verify-token`, then
    `GET /services/users/{uuid}`) and act on the resulting user identity.
servers:
  - url: /
paths:
  /health:
    get:
      summary: Liveness probe
      description: >
        Returns `200` with the unified success envelope and
        `data.status = "ok"`. Performs no database access and no heavy work;
        intended for container healthchecks.
      responses:
        '200':
          description: Service is alive.
  /example:
    get:
      summary: Example interface
      responses:
        '200': { description: Success }
  /texture/upload:
    post:
      summary: Upload texture and generate preview
      description: >
        Multipart upload. The authenticated user's UID is taken from the
        verified Bearer token; there is no `uid` request parameter. Form
        fields: `file` (PNG, required), `type` (`skin` or `cape`), `model`
        (skin model), `name`, `description`, `tags`. Uploading an existing
        `(uid, hash)` combination updates the stored record instead of
        creating a new one.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, type]
              properties:
                file:
                  type: string
                  format: binary
                type:
                  type: string
                  enum: [skin, cape]
                model:
                  type: string
                name:
                  type: string
                description:
                  type: string
                tags:
                  type: string
      responses:
        '200': { description: Successfully updated existing record }
        '201': { description: Successfully created new record }
        '400':
          description: >
            Validation failure; `code` is one of `invalid_texture_type`,
            `invalid_texture_model`, `invalid_texture_file`,
            `invalid_texture_size`, `texture_name_required`,
            `texture_file_required`
        '401': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /texture/listpreview:
    get:
      summary: Get preview list
      description: >
        Public read (no auth). Idempotent read. Returns the preview catalog
        as `data` — an array of texture records.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  message: { type: string }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TextureRecord'
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /texture/preview/{preview_file}:
    get:
      summary: Get preview file
      parameters:
        - in: path
          name: preview_file
          required: true
          schema:
            type: string
      responses:
        '200':
          description: webp file
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /texture/pull/{hash}:
    get:
      summary: Pull original texture file
      parameters:
        - in: path
          name: hash
          required: true
          schema:
            type: string
      responses:
        '200':
          description: png file
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /profile/textures:
    get:
      summary: Get current user's texture list
      description: >
        Returns the authenticated user's texture records. `data` is an object
        carrying the caller's `uid` and an `items` array of texture records,
        newest first (`id desc`). Idempotent read.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum: [all, skin, cape]
            default: all
          description: Filter by texture type; `all` returns skins then capes.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  message: { type: string }
                  data:
                    type: object
                    required: [uid, items]
                    properties:
                      uid:
                        type: integer
                        description: Owning user UID
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/TextureRecord'
        '401': { $ref: '#/components/responses/Error' }
  /texture/delete:
    post:
      summary: Delete a texture owned by the current user
      description: |
        Removes the texture record matching the authenticated user's UID plus
        `(type, hash)` from the database and forcibly cleans up the original
        PNG file and the WebP preview file from disk. Even if other users
        still reference the same hash, the files are removed; their DB records
        are left untouched.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, hash]
              properties:
                type:
                  type: string
                  enum: [skin, cape]
                hash:
                  type: string
                  description: SHA-256 hash (64-char hex)
      responses:
        '200': { description: Texture deleted }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >
        OAuth2 access token issued by HRPAuth core; validated server-side via
        the core's internal endpoints, not against a local database.
  responses:
    Error:
      description: Standard error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    TextureRecord:
      type: object
      description: >
        Texture library record (HASkinLib
        controllers/list_preview_controller.go::listPreviewItem and
        controllers/profile_controller.go::profileTextureItem share this
        shape). `model` is optional (omitempty in the Go structs); every
        other field is always present.
      required: [id, hash, type, uid, width, height, file_name, preview_file, name, description, tags, created_at, updated_at]
      properties:
        id:
          type: integer
        hash:
          type: string
          description: SHA-256 hash (64-char hex) of the original texture
        type:
          type: string
          enum: [skin, cape]
        model:
          type: string
          description: Skin model; omitted when empty
        uid:
          type: integer
          description: Owning user UID
        width:
          type: integer
        height:
          type: integer
        file_name:
          type: string
          description: Stored original file name
        preview_file:
          type: string
          description: Generated WebP preview file name (served by /texture/preview/{preview_file})
        name:
          type: string
        description:
          type: string
        tags:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
    ErrorEnvelope:
      type: object
      required: [success, message, code, error, meta]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        code:
          type: string
        error:
          type: string
        meta:
          $ref: '#/components/schemas/Meta'
