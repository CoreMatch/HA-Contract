openapi: 3.1.0
info:
  title: HASkinLib Business API
  version: 1.0.0
  description: Unified specification for HASkinLib business interfaces.
servers:
  - url: /
paths:
  /example:
    get:
      summary: Example interface
      responses:
        '200': { description: Success }
  /texture/upload:
    post:
      summary: Upload texture and generate preview
      responses:
        '200': { description: Successfully updated existing record }
        '201': { description: Successfully created new record }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /texture/listpreview:
    get:
      summary: Get preview list
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /texture/preview/{preview_file}:
    get:
      summary: Get preview file
      parameters:
        - in: path
          name: preview_file
          required: true
          schema:
            type: string
      responses:
        '200':
          description: webp file
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /texture/pull/{hash}:
    get:
      summary: Pull original texture file
      parameters:
        - in: path
          name: hash
          required: true
          schema:
            type: string
      responses:
        '200':
          description: png file
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /profile/textures:
    get:
      summary: Get current user's texture list
      responses:
        '200': { description: Success }
        '401': { $ref: '#/components/responses/Error' }
components:
  responses:
    Error:
      description: Standard error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
    ErrorEnvelope:
      type: object
      required: [success, message, code, error, meta]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        code:
          type: string
        error:
          type: string
        meta:
          $ref: '#/components/schemas/Meta'
