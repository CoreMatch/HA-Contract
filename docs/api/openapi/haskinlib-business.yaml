openapi: 3.1.0
info:
  title: HASkinLib Business API
  version: 1.0.0
  description: HASkinLib 业务接口统一规范。
servers:
  - url: /
paths:
  /example:
    get:
      summary: 示例接口
      responses:
        '200': { description: 成功 }
  /texture/upload:
    post:
      summary: 上传材质并生成预览
      responses:
        '200': { description: 更新既有记录成功 }
        '201': { description: 新建记录成功 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /texture/listpreview:
    get:
      summary: 获取预览列表
      responses:
        '200': { description: 成功 }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /texture/preview/{preview_file}:
    get:
      summary: 获取预览文件
      parameters:
        - in: path
          name: preview_file
          required: true
          schema:
            type: string
      responses:
        '200':
          description: webp 文件
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /texture/pull/{hash}:
    get:
      summary: 拉取原始材质文件
      parameters:
        - in: path
          name: hash
          required: true
          schema:
            type: string
      responses:
        '200':
          description: png 文件
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /profile/textures:
    get:
      summary: 获取当前用户材质列表
      responses:
        '200': { description: 成功 }
        '401': { $ref: '#/components/responses/Error' }
components:
  responses:
    Error:
      description: 标准错误响应
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
    ErrorEnvelope:
      type: object
      required: [success, message, code, error, meta]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        code:
          type: string
        error:
          type: string
        meta:
          $ref: '#/components/schemas/Meta'
