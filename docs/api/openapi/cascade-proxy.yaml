openapi: 3.1.0
info:
  title: Cascade Proxy Management API
  version: 1.2.0
  description: >
    HTTP management surface of the Cascade edge proxy itself (the backend
    control plane it forwards to is specified separately in
    `cascade-backend-v1.yaml`). Room endpoints are a facade: they forward to
    the room's backend and pass the backend's raw JSON response through, so
    success bodies are backend-defined. v1.2 (2026-11-12): registers the
    contract-first `GET /api/plugins` out-of-process plugin status endpoint
    (additive only; no existing endpoint, field, or response semantics
    changed). Since v1.1 every error response on
    this surface uses the unified envelope
    `{"success": false, "code": ..., "message": ..., "meta": {"request_id": ...}}`
    (see `components.schemas.ErrorEnvelope`). Facade-level `code` values are
    the `lower_snake` codes registered in HA-Contract
    `docs/api/error-codes.md` (`cascade_room_conflict`,
    `cascade_backend_unavailable`, `cascade_invalid_internal_key`,
    `cascade_database_not_configured`, `cascade_binding_not_found`,
    `invalid_json_body`, `invalid_credentials`, `internal_error`,
    `route_not_found`). When the backend itself answers with an error, its
    stable `UPPER_SNAKE` contract code (`FORBIDDEN`, `SESSION_NOT_FOUND`,
    `ROOM_CONFLICT`, ...), status, and message are forwarded verbatim in the
    same envelope shape; those codes are registered in the Cascade backend
    contract, not in the global registry. Unmatched routes return the
    envelope with `route_not_found` (404); recovered panics return
    `internal_error` (500). Success response shapes are unchanged. The
    account endpoints exist only when an HRPAuth client is configured; the
    internal endpoints require the `X-Internal-Key` header.
servers:
  - url: /
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: '`{"status": "ok"}`'
  /readyz:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: '`{"status": "ready"}`'
        '503':
          description: No healthy backend; envelope with `cascade_backend_unavailable`
  /api/backends:
    get:
      summary: List backend statuses
      responses:
        '200':
          description: '`{"backends": [...]}` with each backend''s status object'
  /api/plugins:
    get:
      summary: List out-of-process plugin statuses
      description: >-
        Read-only status snapshot of every configured plugin (including
        disabled ones), in configuration order. Registered contract-first per
        Cascade knowledge/0008 and implemented in Cascade 4943d6f
        (2026-11-12); the planned-endpoint exemption in the route-drift
        check was removed when the route landed. The data source is
        `internal/plugin/hub.go::Status`, serialized with the camelCase
        field names fixed by the `PluginStatus` schema below. Follows the
        `/api/*` management convention: no per-route auth (the management
        surface is network-gated; only `/internal/*` requires
        `X-Internal-Key`). Idempotent read.
      responses:
        '200':
          description: '`{"plugins": [...]}` (empty array when no plugin is configured)'
          content:
            application/json:
              schema:
                type: object
                required: [plugins]
                properties:
                  plugins:
                    type: array
                    items:
                      $ref: '#/components/schemas/PluginStatus'
  /api/rooms:
    get:
      summary: List rooms known to the proxy
      responses:
        '200':
          description: '`{"rooms": [...]}` (empty array when none)'
    post:
      summary: Create a room (facade over the backend create call)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                title: { type: string }
                maxPlayers: { type: integer }
      responses:
        '201':
          description: Backend response passed through
        '400':
          description: Malformed body; envelope with `invalid_json_body`
        '409':
          description: Room claimed by multiple backends; envelope with `cascade_room_conflict`
        '503':
          description: >-
            Owning backend unhealthy or unreachable; envelope with
            `cascade_backend_unavailable`. A backend error answer is
            forwarded verbatim (its status plus `UPPER_SNAKE` code and
            message in the envelope).
  /api/rooms/{code}:
    get:
      summary: Get room state (forwarded to the backend)
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Backend response passed through
        '409':
          description: Room claimed by multiple backends; envelope with `cascade_room_conflict`
        '503':
          description: Backend unavailable; envelope with `cascade_backend_unavailable` (backend error answers forwarded verbatim)
    delete:
      summary: Delete a room (forwarded to the backend)
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '200':
          description: '`{"message": "room deleted"}` (backend answered 204)'
        '409':
          description: Room claimed by multiple backends; envelope with `cascade_room_conflict`
        '503':
          description: Backend unavailable; envelope with `cascade_backend_unavailable` (backend error answers forwarded verbatim)
  /api/rooms/{code}/settings:
    put:
      summary: Update room settings (forwarded to the backend)
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                mapName: { type: string }
                credits: { type: integer }
                fogOfWar: { type: integer }
                income: { type: number }
                disableNuke: { type: boolean }
                sharedControl: { type: boolean }
                startingUnits: { type: integer }
                maxUnits: { type: integer }
      responses:
        '200':
          description: Backend response passed through
        '400':
          description: Malformed body; envelope with `invalid_json_body`
        '409':
          description: Room claimed by multiple backends; envelope with `cascade_room_conflict`
        '503':
          description: Backend unavailable; envelope with `cascade_backend_unavailable` (backend error answers forwarded verbatim)
  /api/rooms/{code}/kick:
    post:
      summary: Kick a player (forwarded to the backend)
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerId]
              properties:
                playerId: { type: string }
      responses:
        '200':
          description: '`{"message": "player kicked"}` (backend answered 204)'
        '400':
          description: Malformed body; envelope with `invalid_json_body`
        '409':
          description: Room claimed by multiple backends; envelope with `cascade_room_conflict`
        '503':
          description: Backend unavailable; envelope with `cascade_backend_unavailable` (backend error answers forwarded verbatim)
  /api/rooms/{code}/ban:
    post:
      summary: Ban a player (forwarded to the backend)
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerId]
              properties:
                playerId: { type: string }
      responses:
        '200':
          description: '`{"message": "player banned"}` (backend answered 204)'
        '400':
          description: Malformed body; envelope with `invalid_json_body`
        '409':
          description: Room claimed by multiple backends; envelope with `cascade_room_conflict`
        '503':
          description: Backend unavailable; envelope with `cascade_backend_unavailable` (backend error answers forwarded verbatim)
  /api/rooms/{code}/players:
    get:
      summary: List room players (forwarded to the backend)
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Backend response passed through
        '409':
          description: Room claimed by multiple backends; envelope with `cascade_room_conflict`
        '503':
          description: Backend unavailable; envelope with `cascade_backend_unavailable` (backend error answers forwarded verbatim)
  /api/auth/verify:
    post:
      summary: Verify HA credentials (only present when HRPAuth is configured)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string }
                password: { type: string }
      responses:
        '200':
          description: '`{uuid, email, username}` of the verified user'
        '400':
          description: Malformed body; envelope with `invalid_json_body`
        '401':
          description: Envelope with `invalid_credentials`
        '502':
          description: HRPAuth call failed; envelope with `internal_error`
  /api/auth/claim:
    post:
      summary: Claim a game binding for an HA user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gameUUID, haUserUUID]
              properties:
                gameUUID: { type: string }
                haUserUUID: { type: string }
      responses:
        '200':
          description: '`{"success": true}`'
        '400':
          description: Malformed body; envelope with `invalid_json_body`
        '404':
          description: No unclaimed binding for the game UUID; envelope with `cascade_binding_not_found`
        '500':
          description: Envelope with `cascade_database_not_configured` (no binding database) or `internal_error` (claim failed)
  /api/auth/status/{gameUUID}:
    get:
      summary: Get the binding for a game UUID
      parameters:
        - in: path
          name: gameUUID
          required: true
          schema: { type: string }
      responses:
        '200':
          description: '`{gameUUID, haUserUUID, playerName, cbh, quickAuth, lastLogin}`'
        '404':
          description: Envelope with `cascade_binding_not_found`
        '500':
          description: Envelope with `cascade_database_not_configured` (no binding database) or `internal_error` (lookup failed)
  /api/auth/bindings/{haUserUUID}:
    get:
      summary: List all bindings of an HA user
      parameters:
        - in: path
          name: haUserUUID
          required: true
          schema: { type: string }
      responses:
        '200':
          description: '`{"data": [...]}` binding objects'
        '500':
          description: Envelope with `cascade_database_not_configured` (no binding database) or `internal_error` (lookup failed)
  /internal/heartbeat:
    get:
      summary: Internal liveness probe
      description: Requires the `X-Internal-Key` header.
      parameters:
        - in: header
          name: X-Internal-Key
          required: true
          schema: { type: string }
      responses:
        '200':
          description: '`{"status": "ok"}`'
        '401':
          description: Envelope with `cascade_invalid_internal_key`
  /internal/proxy-register:
    post:
      summary: Record a proxy-registered player binding
      description: Requires the `X-Internal-Key` header.
      parameters:
        - in: header
          name: X-Internal-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gameUUID, playerName]
              properties:
                gameUUID: { type: string }
                playerName: { type: string }
      responses:
        '200':
          description: '`{"success": true}`'
        '400':
          description: Malformed body; envelope with `invalid_json_body`
        '401':
          description: Envelope with `cascade_invalid_internal_key`
        '500':
          description: Envelope with `cascade_database_not_configured` (no binding database) or `internal_error` (insert failed)
components:
  schemas:
    ErrorEnvelope:
      type: object
      description: >-
        Unified shape of every Cascade management-API error response
        (v1.1). Facade-level codes are the lower_snake codes registered in
        HA-Contract docs/api/error-codes.md; backend answers keep their
        UPPER_SNAKE contract code, status, and message verbatim.
      required: [success, code, message, meta]
      properties:
        success:
          type: boolean
          enum: [false]
        code:
          type: string
        message:
          type: string
        meta:
          type: object
          required: [request_id]
          properties:
            request_id:
              type: string
              description: Random 32-character hex identifier for log correlation
    PluginStatus:
      type: object
      description: >-
        Read-only status of one out-of-process plugin
        (`internal/plugin/hub.go::PluginStatus`). Every field is always
        serialized (no omitempty in the struct), hence all are required per
        the ecosystem serialization convention. Counters are process-local
        (reset on restart).
      required:
        [
          name,
          baseUrl,
          enabled,
          ready,
          manifestId,
          manifestVersion,
          events,
          queued,
          delivered,
          dropped,
          denied,
          failOpen,
        ]
      properties:
        name:
          type: string
          description: Plugin entry name (unique, from Plugins.json)
        baseUrl:
          type: string
          description: Plugin HTTP base URL
        enabled:
          type: boolean
          description: False when the entry is explicitly disabled
        ready:
          type: boolean
          description: True once manifest negotiation succeeded
        manifestId:
          type: string
          description: Negotiated manifest id (empty until ready)
        manifestVersion:
          type: string
          description: Negotiated manifest version (empty until ready)
        events:
          type: array
          items:
            type: string
          description: Event names negotiated with this plugin
        queued:
          type: integer
          description: Current observe-queue depth
        delivered:
          type: integer
          format: int64
          description: Events delivered successfully
        dropped:
          type: integer
          format: int64
          description: Observe events dropped on failure/overflow
        denied:
          type: integer
          format: int64
          description: Veto denies issued by this plugin
        failOpen:
          type: integer
          format: int64
          description: Veto consultations that failed open
