openapi: 3.1.0
info:
  title: MatchCoreArena Business API
  version: 1.1.0
  description: >
    Unified specification for MatchCoreArena server business interfaces.
    Authentication via HRPAuth OAuth2 Authorization Code + PKCE.
    All protected endpoints require `Authorization: Bearer <access_token>`.
servers:
  - url: /
paths:
  /status:
    get:
      summary: Get service status
      tags: [System]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  # ─── Authentication ────────────────────────────────────────────────────
  /api/auth/login-ticket:
    post:
      summary: Authenticate with email and password
      description: >
        Proxies email/password to HRPAuth's /oauth/login-ticket endpoint.
        Returns access_token/refresh_token directly if no second factor is
        required, or returns `login_ticket` plus the allowed second-factor
        methods. The current HRPAuth backend may advertise TOTP, WebAuthn, or
        both via `totp_required`, `webauthn_required`, and `second_factors`.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  description: User's email
                password:
                  type: string
                  description: User's password
      responses:
        '200':
          description: Authentication processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginTicketResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/auth/totp-verify:
    post:
      summary: Verify TOTP passcode
      description: >
        Proxies login_ticket + passcode to HRPAuth's /totp/verify endpoint.
        This endpoint only covers the TOTP branch of the second-factor flow.
        If HRPAuth advertises `webauthn` in `second_factors`, the client must
        complete the WebAuthn ceremony against the corresponding HRPAuth
        WebAuthn endpoints.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_ticket, passcode]
              properties:
                login_ticket:
                  type: string
                  description: Login ticket from /api/auth/login-ticket
                passcode:
                  type: string
                  description: 6-digit TOTP passcode
      responses:
        '200':
          description: TOTP verification successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/auth/refresh:
    post:
      summary: Refresh access token
      description: >
        Exchange a valid refresh_token for a new access_token/refresh_token pair.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  description: Refresh token from previous token response
      responses:
        '200':
          description: Refresh successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/auth/logout:
    post:
      summary: Revoke tokens and logout
      description: >
        Revokes the current access_token and/or refresh_token.
        Requires Bearer authentication.
      tags: [Auth]
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                access_token:
                  type: string
                  description: Access token to revoke (optional, defaults to Bearer token)
                refresh_token:
                  type: string
                  description: Refresh token to revoke (optional)
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  # ─── Users ─────────────────────────────────────────────────────────────
  /api/users/me:
    get:
      summary: Get current user profile
      description: Returns the authenticated user's full profile.
      tags: [Users]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/Error' }

  /api/users/{uuid}:
    get:
      summary: Get user profile by UUID
      description: Returns a user's public profile.
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
          description: User UUID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/users/me/experience:
    post:
      summary: Add experience to current user
      description: Increases the authenticated user's experience points.
      tags: [Users]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: integer
                  format: int64
                  description: Amount of experience to add
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  # ─── Friends ───────────────────────────────────────────────────────────
  /api/friends:
    get:
      summary: List friends
      description: Returns the authenticated user's friend list (accepted only).
      tags: [Friends]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Friend'
        '401': { $ref: '#/components/responses/Error' }
    post:
      summary: Send friend request
      description: Sends a friend request to the target user.
      tags: [Friends]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_uuid]
              properties:
                target_uuid:
                  type: string
                  format: uuid
                  description: Target user's UUID
      responses:
        '201':
          description: Friend request sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Friend'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/friends/{id}/accept:
    put:
      summary: Accept friend request
      description: Accepts a pending friend request.
      tags: [Friends]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Friend request ID
      responses:
        '200':
          description: Friend request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/friends/{id}/reject:
    put:
      summary: Reject friend request
      description: Rejects a pending friend request.
      tags: [Friends]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Friend request ID
      responses:
        '200':
          description: Friend request rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/friends/{id}:
    delete:
      summary: Delete friend
      description: Removes a friend relationship.
      tags: [Friends]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Friend relationship ID
      responses:
        '200':
          description: Friend deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  # ─── Teams ─────────────────────────────────────────────────────────────
  /api/teams:
    post:
      summary: Create team
      description: Creates a new team. The creator becomes the leader.
      tags: [Teams]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 50
                  description: Team name (must be unique)
                description:
                  type: string
                  description: Team description
      responses:
        '201':
          description: Team created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Team'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/teams/{id}:
    get:
      summary: Get team by ID
      description: Returns team details.
      tags: [Teams]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Team ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Team'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: Disband team
      description: Disbands the team. Only the leader can perform this action.
      tags: [Teams]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Team ID
      responses:
        '200':
          description: Team disbanded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/teams/{id}/members:
    get:
      summary: List team members
      description: Returns all members of the specified team.
      tags: [Teams]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Team ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TeamMember'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: Add team member
      description: Adds a user to the team. Requires leader or vice-leader role.
      tags: [Teams]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Team ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_uuid]
              properties:
                user_uuid:
                  type: string
                  format: uuid
                  description: UUID of the user to add
                role:
                  type: integer
                  enum: [0, 1]
                  default: 0
                  description: 'Role: 0=member, 1=vice-leader'
      responses:
        '200':
          description: Member added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TeamMember'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/teams/{id}/members/{uuid}/role:
    put:
      summary: Update team member role
      description: Changes a member's role. Requires leader role.
      tags: [Teams]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Team ID
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
          description: Target user UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: integer
                  enum: [0, 1, 2]
                  description: 'New role: 0=member, 1=vice-leader, 2=leader'
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/teams/{id}/members/{uuid}:
    delete:
      summary: Remove team member
      description: Removes a member from the team. Requires leader or vice-leader role.
      tags: [Teams]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Team ID
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
          description: Target user UUID
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  # ─── Matches ───────────────────────────────────────────────────────────
  /api/matches:
    post:
      summary: Report match result
      description: Records a completed match result.
      tags: [Matches]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamReportInput'
      responses:
        '201':
          description: Match recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Match'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/matches/{id}:
    get:
      summary: Get match by ID
      description: Returns match details.
      tags: [Matches]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Match ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Match'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/matches/me:
    get:
      summary: List my match history
      description: Returns the authenticated user's match history with pagination.
      tags: [Matches]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page_num
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: page_size
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Page size
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Match'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  # ─── Rankings ──────────────────────────────────────────────────────────
  /api/rankings/{type}:
    get:
      summary: Get top rankings
      description: Returns the top N rankings for the specified type and season.
      tags: [Rankings]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: type
          required: true
          schema:
            type: string
          description: Ranking type (e.g. "1v1", "2v2")
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            maximum: 500
          description: Number of entries to return
        - in: query
          name: season
          schema:
            type: integer
            default: 1
          description: Season number
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Ranking'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/rankings/me:
    get:
      summary: Get my ranking
      description: Returns the authenticated user's ranking for the specified type.
      tags: [Rankings]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: type
          required: true
          schema:
            type: string
          description: Ranking type
        - in: query
          name: season
          schema:
            type: integer
            default: 1
          description: Season number
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Ranking'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  # ─── Maintenance ────────────────────────────────────────────────────────
  /api/maintenance/sql:
    post:
      summary: Execute raw SQL statement
      description: >
        Directly executes a raw SQL query against the database.
        Returns a JSON Map array for SELECT queries, or execution metadata for others.
        Requires `maintenance` scope.
      tags: [Maintenance]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sql]
              properties:
                sql:
                  type: string
                  description: The raw SQL query to execute
      responses:
        '200':
          description: SQL executed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - type: array
                            description: Results for SELECT queries
                            items:
                              type: object
                              additionalProperties: true
                          - type: object
                            description: Results for INSERT/UPDATE/DELETE queries
                            properties:
                              rows_affected:
                                type: integer
                              last_insert_id:
                                type: integer
                              message:
                                type: string
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: HRPAuth OAuth2 access token

  responses:
    Error:
      description: Standard error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    # ─── Common ────────────────────────────────────────────────────────────
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string

    SuccessEnvelope:
      type: object
      required: [success, message, meta]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          description: Response payload (varies by endpoint)
        meta:
          $ref: '#/components/schemas/Meta'

    ErrorEnvelope:
      type: object
      required: [success, message, code, error, meta]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        code:
          type: string
          description: Error code
        error:
          type: string
          description: Compatible alias, value matches code
        meta:
          $ref: '#/components/schemas/Meta'

    # ─── Auth ──────────────────────────────────────────────────────────────
    LoginTicketResponse:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          oneOf:
            - type: object
              description: Direct token response (no second factor required)
              required: [access_token, refresh_token]
              properties:
                access_token:
                  type: string
                  description: OAuth2 access token
                refresh_token:
                  type: string
                  description: OAuth2 refresh token
                expires_in:
                  type: integer
                  description: Access token lifetime in seconds
                token_type:
                  type: string
                  description: Token type (typically "Bearer")
                scope:
                  type: string
                  description: Space-delimited scopes carried by the access token
            - type: object
              description: Additional second factor required before token issuance
              required: [totp_required, webauthn_required, second_factors, login_ticket, expires_in]
              properties:
                totp_required:
                  type: boolean
                  description: Whether TOTP is an allowed second factor
                webauthn_required:
                  type: boolean
                  description: Whether WebAuthn is an allowed second factor
                second_factors:
                  type: array
                  description: Allowed second-factor methods for this login_ticket
                  items:
                    type: string
                    enum: [totp, webauthn]
                login_ticket:
                  type: string
                  description: Short-lived ticket for /api/auth/totp-verify or HRPAuth WebAuthn 2FA
                expires_in:
                  type: integer
                  description: Ticket lifetime in seconds
        meta:
          $ref: '#/components/schemas/Meta'

    TokenResponse:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          type: object
          required: [access_token, refresh_token, expires_in, token_type]
          properties:
            access_token:
              type: string
              description: OAuth2 access token (JWT)
            refresh_token:
              type: string
              description: OAuth2 refresh token
            expires_in:
              type: integer
              description: Access token lifetime in seconds
            token_type:
              type: string
              description: Token type (typically "Bearer")
            scope:
              type: string
              description: Space-delimited scopes carried by the access token
        meta:
          $ref: '#/components/schemas/Meta'

    # ─── Users ─────────────────────────────────────────────────────────────
    User:
      type: object
      required: [uuid, level, experience, rank_score, created_at, updated_at]
      properties:
        uuid:
          type: string
          format: uuid
          description: User UUID (Mojang UUID)
        level:
          type: integer
          description: User level
        experience:
          type: integer
          format: int64
          description: Total experience points
        rank_score:
          type: integer
          description: Current rank score
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ─── Friends ───────────────────────────────────────────────────────────
    Friend:
      type: object
      required: [id, user_uuid, friend_uuid, status, created_at]
      properties:
        id:
          type: integer
          format: int64
          description: Friend relationship ID
        user_uuid:
          type: string
          format: uuid
          description: Requester UUID
        friend_uuid:
          type: string
          format: uuid
          description: Target UUID
        status:
          type: integer
          enum: [0, 1, 2]
          description: '0=pending, 1=accepted, 2=rejected'
        created_at:
          type: string
          format: date-time

    # ─── Teams ─────────────────────────────────────────────────────────────
    Team:
      type: object
      required: [id, name, leader_uuid, created_at]
      properties:
        id:
          type: integer
          format: int64
          description: Team ID
        name:
          type: string
          description: Team name
        description:
          type: string
          description: Team description
        leader_uuid:
          type: string
          format: uuid
          description: Leader's UUID
        created_at:
          type: string
          format: date-time

    TeamMember:
      type: object
      required: [id, team_id, user_uuid, role, joined_at]
      properties:
        id:
          type: integer
          format: int64
          description: Membership record ID
        team_id:
          type: integer
          format: int64
        user_uuid:
          type: string
          format: uuid
        role:
          type: integer
          enum: [0, 1, 2]
          description: '0=member, 1=vice-leader, 2=leader'
        joined_at:
          type: string
          format: date-time

    # ─── Matches ───────────────────────────────────────────────────────────
    TeamReportInput:
      type: object
      required: [match_type, winner_team, loser_teams, started_at, finished_at]
      properties:
        match_type:
          type: string
          description: Match type (e.g. "1v1", "2v2", "4v4v4v4")
        winner_team:
          $ref: '#/components/schemas/TeamReportInfo'
        loser_teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamReportInfo'
        duration_seconds:
          type: integer
          default: 0
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time

    TeamReportInfo:
      type: object
      required: [team_id, members]
      properties:
        team_id:
          type: string
        initial_count:
          type: integer
          description: Team initial member count
        alive_count:
          type: integer
          description: Team survivor count at match end
        members:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantReport'

    ParticipantReport:
      type: object
      required: [uuid]
      properties:
        uuid:
          type: string
          format: uuid
        survival_time:
          type: integer
          description: Individual survival time in seconds
        kills:
          type: integer
        deaths:
          type: integer
        perf_tweak:
          type: number
          format: double
          default: 1.0
          description: Individual performance tweak coefficient [0.95, 1.05]
    
    Match:
      type: object
      required: [id, match_type, winner_team_id, survival_rate, duration_seconds, started_at, finished_at, created_at]
      properties:
        id:
          type: integer
          format: int64
        match_type:
          type: string
        winner_team_id:
          type: string
        survival_rate:
          type: number
          format: double
        duration_seconds:
          type: integer
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    
    # ─── Rankings ──────────────────────────────────────────────────────────
    Ranking:
      type: object
      required: [id, user_uuid, rank_type, score, rank_position, season, updated_at]
      properties:
        id:
          type: integer
          format: int64
        user_uuid:
          type: string
          format: uuid
        rank_type:
          type: string
        score:
          type: integer
          format: int64
        rank_position:
          type: integer
        season:
          type: integer
        updated_at:
          type: string
          format: date-time
