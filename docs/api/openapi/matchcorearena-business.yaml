openapi: 3.1.0
info:
  title: MatchCoreArena Business API
  version: 1.4.0
  description: >
    Unified specification for MatchCoreArena server business interfaces.
    Authentication via HRPAuth OAuth2 Authorization Code + PKCE.
    All protected endpoints require `Authorization: Bearer <access_token>`.
servers:
  - url: /
paths:
  /api/status:
    get:
      summary: Get service status
      description: >
        Public liveness/status endpoint (no auth). Returns the unified
        success envelope with the server `version` in `data`.
      tags: [System]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  # ─── Authentication ────────────────────────────────────────────────────
  /api/auth/login-ticket:
    post:
      summary: Authenticate with email and password
      description: >
        Proxies email/password to HRPAuth's /oauth/login-ticket endpoint.
        Returns access_token/refresh_token directly if no second factor is
        required, or returns `login_ticket` plus the allowed second-factor
        methods. The current HRPAuth backend may advertise TOTP, WebAuthn, or
        both via `totp_required`, `webauthn_required`, and `second_factors`.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  description: User's email
                password:
                  type: string
                  description: User's password
      responses:
        '200':
          description: Authentication processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginTicketResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/auth/totp-verify:
    post:
      summary: Verify TOTP passcode
      description: >
        Proxies login_ticket + passcode to HRPAuth's /totp/verify endpoint.
        This endpoint only covers the TOTP branch of the second-factor flow.
        If HRPAuth advertises `webauthn` in `second_factors`, the client must
        complete the WebAuthn ceremony against the corresponding HRPAuth
        WebAuthn endpoints.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_ticket, passcode]
              properties:
                login_ticket:
                  type: string
                  description: Login ticket from /api/auth/login-ticket
                passcode:
                  type: string
                  description: 6-digit TOTP passcode
      responses:
        '200':
          description: TOTP verification successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/auth/refresh:
    post:
      summary: Refresh access token
      description: >
        Exchange a valid refresh_token for a new access_token/refresh_token pair.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  description: Refresh token from previous token response
      responses:
        '200':
          description: Refresh successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/auth/logout:
    post:
      summary: Revoke tokens and logout
      description: >
        Revokes the Bearer access token presented in the `Authorization`
        header (the token resolved by the auth middleware). No request body
        is accepted. Requires Bearer authentication.
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  # ─── Users ─────────────────────────────────────────────────────────────
  /api/users/me:
    get:
      summary: Get current user profile
      description: Returns the authenticated user's full profile.
      tags: [Users]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/Error' }

  /api/users/{uid}:
    get:
      summary: Get user profile by UID
      description: Returns a user's public profile.
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: integer
            format: int64
          description: Numeric user UID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/users/{uid}/matches:
    get:
      summary: List a player's match history
      description: >
        Returns the matches the given player participated in, most recent
        first, with pagination. Participant details are omitted in list
        responses (see GET /api/matches/{id}).
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: integer
            format: int64
          description: Numeric user UID
        - in: query
          name: page_num
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: page_size
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Page size
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Match'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/users/me/experience:
    post:
      summary: Add experience to current user
      description: Increases the authenticated user's experience points.
      tags: [Users]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: integer
                  format: int64
                  description: Amount of experience to add
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  # ─── Friends ───────────────────────────────────────────────────────────
  # The friend feature is explicitly unimplemented: every endpoint below
  # answers `501 mca_not_implemented` (author decision; no fake data).
  /api/friends:
    get:
      summary: List friends
      description: >
        Returns the authenticated user's friend list (accepted only).
        Currently unimplemented: always answers `501 mca_not_implemented`.
      tags: [Friends]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Friend'
        '401': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }
    post:
      summary: Send friend request
      description: >
        Sends a friend request to the target user, identified by their HA
        username (resolved to a UID through the HRPAuth core lookup, with a
        Redis-cached resolution).
        Currently unimplemented: the username is resolved, then the request
        always answers `501 mca_not_implemented`.
      tags: [Friends]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  description: Target user's HA username
      responses:
        '201':
          description: Friend request sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Friend'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }

  /api/friends/{id}/accept:
    put:
      summary: Accept friend request
      description: >
        Accepts a pending friend request.
        Currently unimplemented: always answers `501 mca_not_implemented`.
      tags: [Friends]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Friend request ID
      responses:
        '200':
          description: Friend request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }

  /api/friends/{id}/reject:
    put:
      summary: Reject friend request
      description: >
        Rejects a pending friend request.
        Currently unimplemented: always answers `501 mca_not_implemented`.
      tags: [Friends]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Friend request ID
      responses:
        '200':
          description: Friend request rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }

  /api/friends/{id}:
    delete:
      summary: Delete friend
      description: >
        Removes a friend relationship.
        Currently unimplemented: always answers `501 mca_not_implemented`.
      tags: [Friends]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Friend relationship ID
      responses:
        '200':
          description: Friend deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }

  # ─── Teams ─────────────────────────────────────────────────────────────
  # The team feature is explicitly unimplemented: every endpoint below
  # answers `501 mca_not_implemented` (author decision; no fake data).
  /api/teams:
    post:
      summary: Create team
      description: >
        Creates a new team. The creator becomes the leader.
        Currently unimplemented: always answers `501 mca_not_implemented`.
      tags: [Teams]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 50
                  description: Team name (must be unique)
                description:
                  type: string
                  description: Team description
      responses:
        '201':
          description: Team created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Team'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }

  /api/teams/{id}:
    get:
      summary: Get team by ID
      description: >
        Returns team details.
        Currently unimplemented: always answers `501 mca_not_implemented`.
      tags: [Teams]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Team ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Team'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }
    delete:
      summary: Disband team
      description: >
        Disbands the team. Only the leader can perform this action.
        Currently unimplemented: always answers `501 mca_not_implemented`.
      tags: [Teams]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Team ID
      responses:
        '200':
          description: Team disbanded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }

  /api/teams/{id}/members:
    get:
      summary: List team members
      description: >
        Returns all members of the specified team.
        Currently unimplemented: always answers `501 mca_not_implemented`.
      tags: [Teams]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Team ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TeamMember'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }
    post:
      summary: Add team member
      description: >
        Adds a user to the team. Requires leader or vice-leader role.
        Currently unimplemented: always answers `501 mca_not_implemented`.
      tags: [Teams]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Team ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_uid]
              properties:
                user_uid:
                  type: integer
                  format: int64
                  description: Numeric UID of the user to add
                role:
                  type: integer
                  enum: [0, 1]
                  default: 0
                  description: 'Role: 0=member, 1=vice-leader'
      responses:
        '200':
          description: Member added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TeamMember'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }

  /api/teams/{id}/members/{uid}/role:
    put:
      summary: Update team member role
      description: >
        Changes a member's role. Requires leader role.
        Currently unimplemented: always answers `501 mca_not_implemented`.
      tags: [Teams]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Team ID
        - in: path
          name: uid
          required: true
          schema:
            type: integer
            format: int64
          description: Target user UID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: integer
                  enum: [0, 1, 2]
                  description: 'New role: 0=member, 1=vice-leader, 2=leader'
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }

  /api/teams/{id}/members/{uid}:
    delete:
      summary: Remove team member
      description: >
        Removes a member from the team. Requires leader or vice-leader role.
        Currently unimplemented: always answers `501 mca_not_implemented`.
      tags: [Teams]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Team ID
        - in: path
          name: uid
          required: true
          schema:
            type: integer
            format: int64
          description: Target user UID
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }

  # ─── Matches ───────────────────────────────────────────────────────────
  /api/matches:
    post:
      summary: Report match result (single reporting entry point)
      description: >
        Records a completed match result and settles ratings in one
        transaction. This is the ONLY match-reporting entry point: game
        servers and ops/debug tooling submit here alike. `source` is a
        provenance marker only (`game` default, `virtual` for ops-injected
        debug data) and never branches settlement.

        Authorization: reporting requires an OPS-level credential
        (maintenance token or a `tokens.yaml` service token) carrying the
        `match:report` scope; ordinary player tokens are rejected with
        `403 oauth_insufficient_scope` even if the scope is present.

        Payload shape: either the unified `teams` array (each team carries
        `result` win/lose/draw; at most one winner, no win/draw mixing,
        all-draw allowed and settled with S=0.5) or the equivalent legacy
        `winner_team` + `loser_teams` form. Self-contradictory payloads are
        rejected with `400 mca_report_inconsistent` (multiple winners,
        win/draw mixing, duplicate participant UUIDs, alive/initial count
        violations, negative stats, `perf_tweak` outside [0.95, 1.05],
        `finished_at` before `started_at`, or a positive
        `duration_seconds` that disagrees with the timestamp difference).

        Idempotency: `game_id` is the reporter-supplied stable key (unique
        constraint). Re-reporting the same `game_id` with an identical
        normalized payload replays the existing record with `200` and does
        NOT settle again; the same `game_id` with a different payload
        answers `409 mca_game_id_conflict`.

        Identity: participant Minecraft UUIDs are resolved to HRPAuth UIDs
        through the ops-level service endpoint `GET /services/users/{uuid}`
        (see `hrpauth-business.yaml`) using a `client_credentials` service
        token: a participant unknown to HRPAuth aborts the report with
        `404 mca_user_not_found`, and a service-credential or HRPAuth
        outage aborts with `502 oauth_hrpauth_down`. A participant whose
        resolved HRPAuth UID has no local `users` row is provisioned
        lazily: the settlement transaction inserts the row (uid taken from
        the verified resolution only; rating fields are table defaults,
        never reporter-supplied) and continues.
        `409 mca_user_not_provisioned` is answered only when that lazy
        provisioning is impossible (e.g. the uid is held by a soft-deleted
        row); the transaction then rolls back and nothing is written.

        Party sharing: when `matchmaking_group_id` references a formed
        matchmaking group, members of the same matchmaking party (>= 2 of
        them in this match) share the average of their individual rating
        deltas.
      tags: [Matches]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamReportInput'
      responses:
        '200':
          description: >
            Idempotent replay — a match with this `game_id` and an
            identical payload was already recorded; the existing record is
            returned and nothing is settled again.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Match'
        '201':
          description: Match recorded and settled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Match'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/matches/{id}:
    get:
      summary: Get match by ID
      description: >
        Returns match details, including the participant list with each
        participant's rating before/delta in this match.
      tags: [Matches]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: Match ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Match'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/matches/me:
    get:
      summary: List my match history
      description: Returns the authenticated user's match history with pagination.
      tags: [Matches]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page_num
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: page_size
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Page size
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Match'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  # ─── Matchmaking ───────────────────────────────────────────────────────
  /api/matchmaking/join:
    post:
      summary: Join the matchmaking queue (solo or as a party)
      description: >
        Enqueues for a configured match mode. One queue entry per user
        overall; joining again answers `409 mca_queue_already_joined`.
        Unknown modes or a disabled matchmaking system answer
        `400 mca_invalid_request`. The user's `users` row is provisioned
        lazily with the same trust boundary as match settlement, and
        `rank_score` is snapshotted into the queue entry.

        Party join (`party_members`, same field name the ops panel sends):
        a non-empty member UUID list enqueues the whole roster as one unit.
        Member UUIDs are resolved to HRPAuth UIDs through the same
        ops-level service endpoint as match reports — an unknown member
        answers `404 mca_user_not_found`, an HRPAuth/service-credential
        outage answers `502 oauth_hrpauth_down`. The roster must have 2
        to (mode max team size) distinct members; oversized rosters answer
        `409 mca_party_full`. A roster member already in another queued
        party answers `409 mca_party_already_in_party` (and such a user
        can also not solo-queue). The party is ephemeral: it is created at
        join time and cleaned up when the group is committed or the whole
        party leaves. Party members always enter the same formed match and
        are assigned to the same team; their rating deltas are shared
        (averaged) when the match is reported with the formed group's
        `matchmaking_group_id`.

        A background engine removes entries older than the configured
        timeout and forms matches within a rating window that widens with
        wait time; formed matches are recorded and queryable via
        `/api/matchmaking/status`. The queue survives process restarts
        (first engine tick re-runs timeout cleanup).
      tags: [Matchmaking]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [match_type]
              properties:
                match_type:
                  type: string
                  description: Queue mode (a configured matchmaking mode, e.g. "1v1", "2v2")
                party_members:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: >
                    Optional member UUID list. Non-empty enqueues the whole
                    roster as one party unit; empty/omitted queues solo.
      responses:
        '201':
          description: Joined the queue
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        description: >
                          All queue entries created by this request (one for
                          solo join, one per roster member for party join).
                        items:
                          $ref: '#/components/schemas/QueueEntry'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/matchmaking/leave:
    delete:
      summary: Leave the matchmaking queue
      description: >
        Removes the authenticated user's queue entry. Without an entry the
        server answers `404 mca_queue_not_joined`. If the user queued with
        a party, the WHOLE party is removed from the queue and the
        ephemeral party is cleaned up.
      tags: [Matchmaking]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Left the queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/matchmaking/status:
    get:
      summary: Get matchmaking status
      description: >
        Returns the authenticated user's queue state and the recent formed
        matches they belong to (most recent first, up to 10).
      tags: [Matchmaking]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MatchmakingStatus'
        '401': { $ref: '#/components/responses/Error' }

  # ─── Observability ─────────────────────────────────────────────────────
  /api/metrics:
    get:
      summary: Operational metrics snapshot (OPS only)
      description: >
        Returns in-process counters plus the live queue depth per mode.
        Requires an OPS-level credential (maintenance token or a
        `tokens.yaml` service token); ordinary player tokens are rejected
        with `403 oauth_insufficient_scope`. Counter keys include
        `matches_reported_total`, `matches_reported_replay_total`,
        `matches_rejected_total:{code}` (rejection-reason distribution),
        `matchmaking_groups_formed_total:{mode}`, `matchmaking_join_total`,
        `matchmaking_leave_total`, `matchmaking_queue_timeout_removed_total`
        and `matchmaking_parties_created_total`. Counters are process-local
        (reset on restart).
      tags: [Observability]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MetricsSnapshot'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  # ─── Rankings ──────────────────────────────────────────────────────────
  /api/rankings/{type}:
    get:
      summary: Get top rankings
      description: Returns the top N rankings for the specified type and season.
      tags: [Rankings]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: type
          required: true
          schema:
            type: string
          description: Ranking type (e.g. "1v1", "2v2")
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            maximum: 500
          description: Number of entries to return
        - in: query
          name: season
          schema:
            type: integer
            default: 1
          description: Season number
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Ranking'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/rankings/me:
    get:
      summary: Get my ranking
      description: Returns the authenticated user's ranking for the specified type.
      tags: [Rankings]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: type
          required: true
          schema:
            type: string
          description: Ranking type
        - in: query
          name: season
          schema:
            type: integer
            default: 1
          description: Season number
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Ranking'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  # ─── Maintenance ────────────────────────────────────────────────────────
  /api/maintenance/sql:
    post:
      summary: Execute raw SQL statement
      description: >
        Directly executes a raw SQL query against the database.
        Returns a JSON Map array for SELECT queries, or execution metadata for others.
        Requires `maintenance` scope.
      tags: [Maintenance]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sql]
              properties:
                sql:
                  type: string
                  description: The raw SQL query to execute
      responses:
        '200':
          description: SQL executed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - type: array
                            description: Results for SELECT queries
                            items:
                              type: object
                              additionalProperties: true
                          - type: object
                            description: Results for INSERT/UPDATE/DELETE queries
                            properties:
                              rows_affected:
                                type: integer
                              last_insert_id:
                                type: integer
                              message:
                                type: string
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: HRPAuth OAuth2 access token

  responses:
    Error:
      description: Standard error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    # ─── Common ────────────────────────────────────────────────────────────
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string

    SuccessEnvelope:
      type: object
      required: [success, message, meta]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          description: Response payload (varies by endpoint)
        meta:
          $ref: '#/components/schemas/Meta'

    ErrorEnvelope:
      type: object
      required: [success, message, code, error, meta]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        code:
          type: string
          description: Error code
        error:
          type: string
          description: Compatible alias, value matches code
        meta:
          $ref: '#/components/schemas/Meta'

    # ─── Auth ──────────────────────────────────────────────────────────────
    LoginTicketResponse:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          oneOf:
            - type: object
              description: Direct token response (no second factor required)
              required: [access_token, refresh_token]
              properties:
                access_token:
                  type: string
                  description: OAuth2 access token
                refresh_token:
                  type: string
                  description: OAuth2 refresh token
                expires_in:
                  type: integer
                  description: Access token lifetime in seconds
                token_type:
                  type: string
                  description: Token type (typically "Bearer")
                scope:
                  type: string
                  description: Space-delimited scopes carried by the access token
            - type: object
              description: Additional second factor required before token issuance
              required: [totp_required, webauthn_required, second_factors, login_ticket, expires_in]
              properties:
                totp_required:
                  type: boolean
                  description: Whether TOTP is an allowed second factor
                webauthn_required:
                  type: boolean
                  description: Whether WebAuthn is an allowed second factor
                second_factors:
                  type: array
                  description: Allowed second-factor methods for this login_ticket
                  items:
                    type: string
                    enum: [totp, webauthn]
                login_ticket:
                  type: string
                  description: Short-lived ticket for /api/auth/totp-verify or HRPAuth WebAuthn 2FA
                expires_in:
                  type: integer
                  description: Ticket lifetime in seconds
        meta:
          $ref: '#/components/schemas/Meta'

    TokenResponse:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          type: object
          required: [access_token, refresh_token, expires_in, token_type]
          properties:
            access_token:
              type: string
              description: OAuth2 access token (JWT)
            refresh_token:
              type: string
              description: OAuth2 refresh token
            expires_in:
              type: integer
              description: Access token lifetime in seconds
            token_type:
              type: string
              description: Token type (typically "Bearer")
            scope:
              type: string
              description: Space-delimited scopes carried by the access token
        meta:
          $ref: '#/components/schemas/Meta'

    # ─── Users ─────────────────────────────────────────────────────────────
    User:
      type: object
      required: [uuid, level, experience, rank_score, created_at, updated_at]
      properties:
        uuid:
          type: string
          format: uuid
          description: User UUID (Mojang UUID)
        level:
          type: integer
          description: User level
        experience:
          type: integer
          format: int64
          description: Total experience points
        rank_score:
          type: integer
          description: Current rank score
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ─── Friends ───────────────────────────────────────────────────────────
    Friend:
      type: object
      required: [id, user_uuid, friend_uuid, status, created_at]
      properties:
        id:
          type: integer
          format: int64
          description: Friend relationship ID
        user_uuid:
          type: string
          format: uuid
          description: Requester UUID
        friend_uuid:
          type: string
          format: uuid
          description: Target UUID
        status:
          type: integer
          enum: [0, 1, 2]
          description: '0=pending, 1=accepted, 2=rejected'
        created_at:
          type: string
          format: date-time

    # ─── Teams ─────────────────────────────────────────────────────────────
    Team:
      type: object
      required: [id, name, leader_uuid, created_at]
      properties:
        id:
          type: integer
          format: int64
          description: Team ID
        name:
          type: string
          description: Team name
        description:
          type: string
          description: Team description
        leader_uuid:
          type: string
          format: uuid
          description: Leader's UUID
        created_at:
          type: string
          format: date-time

    TeamMember:
      type: object
      required: [id, team_id, user_uuid, role, joined_at]
      properties:
        id:
          type: integer
          format: int64
          description: Membership record ID
        team_id:
          type: integer
          format: int64
        user_uuid:
          type: string
          format: uuid
        role:
          type: integer
          enum: [0, 1, 2]
          description: '0=member, 1=vice-leader, 2=leader'
        joined_at:
          type: string
          format: date-time

    # ─── Matches ───────────────────────────────────────────────────────────
    TeamReportInput:
      type: object
      required: [match_type, started_at, finished_at]
      properties:
        match_type:
          type: string
          description: Match type (e.g. "1v1", "2v2", "4v4v4v4")
        teams:
          type: array
          minItems: 2
          description: >
            Unified shape: at least two teams; at most one team may have
            result `win`, and when one exists the other teams must be
            `lose` (no win/draw mixing). All-draw matches are allowed
            (settled with S=0.5). Mutually exclusive in intent with
            `winner_team`/`loser_teams`; when `teams` is present it wins.
          items:
            $ref: '#/components/schemas/TeamReportInfo'
        winner_team:
          description: >
            Legacy equivalent shape (winner + loser_teams), expanded to the
            unified `teams` shape with win/lose results.
          $ref: '#/components/schemas/TeamReportInfo'
        loser_teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamReportInfo'
        duration_seconds:
          type: integer
          default: 0
          description: >
            Match duration in seconds. When positive it must equal
            finished_at - started_at (otherwise 400 mca_report_inconsistent).
        map_name:
          type: string
          description: Optional map identifier
        server_id:
          type: string
          description: Optional reporting server identifier
        game_id:
          type: string
          maxLength: 64
          description: >
            Optional reporter-supplied stable idempotency key (unique
            constraint). Duplicate reports with an identical payload replay
            the existing record (200); conflicting payloads answer
            409 mca_game_id_conflict.
        source:
          type: string
          enum: [game, virtual]
          default: game
          description: >
            Provenance marker only — never branches settlement. `virtual`
            marks ops/debug-injected data submitted through the same
            endpoint.
        matchmaking_group_id:
          type: integer
          format: int64
          description: >
            Optional formed-group id from matchmaking; when set, members of
            the same matchmaking party share the average of their rating
            deltas. Unknown group ids answer 400 mca_invalid_request.
        started_at:
          type: string
          format: date-time
          description: RFC3339 or "YYYY-MM-DD HH:MM:SS" (UTC)
        finished_at:
          type: string
          format: date-time
          description: RFC3339 or "YYYY-MM-DD HH:MM:SS" (UTC); not before started_at

    TeamReportInfo:
      type: object
      required: [team_id, members]
      properties:
        team_id:
          type: string
        result:
          type: string
          enum: [win, lose, draw]
          description: Required in the unified `teams` shape
        initial_count:
          type: integer
          description: Team initial member count (>= 1)
        alive_count:
          type: integer
          description: Team survivor count at match end (0..initial_count)
        members:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantReport'

    ParticipantReport:
      type: object
      required: [uuid]
      properties:
        uuid:
          type: string
          format: uuid
        survival_time:
          type: integer
          description: Individual survival time in seconds
        kills:
          type: integer
        deaths:
          type: integer
        perf_tweak:
          type: number
          format: double
          description: >
            Individual performance tweak coefficient. Omit (or send 0) for
            the neutral default 1.0; when provided it must lie within
            [0.95, 1.05] — out-of-range values are rejected with
            400 mca_report_inconsistent (same rule as the ops panel's
            client-side validation).
    
    Match:
      type: object
      required: [id, match_type, source, map_name, server_id, game_id, winner_team_id, survival_rate, duration_seconds, started_at, finished_at, created_at]
      properties:
        id:
          type: integer
          format: int64
        match_type:
          type: string
        source:
          type: string
          enum: [game, virtual]
          description: Provenance marker only — never branches settlement
        map_name:
          type: string
          description: Optional map identifier (empty when not provided)
        server_id:
          type: string
          description: Optional reporting server identifier (empty when not provided)
        game_id:
          type: string
          description: Reporter-supplied idempotency key (empty when not provided)
        winner_team_id:
          type: string
          description: Winning team ID (empty for draws)
        survival_rate:
          type: number
          format: double
          description: Winning team survival rate (0 for draws)
        duration_seconds:
          type: integer
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        participants:
          type: array
          description: >
            Participant details with per-match rating movement; populated by
            POST /api/matches and GET /api/matches/{id}, omitted in list
            responses.
          items:
            $ref: '#/components/schemas/ParticipantDetail'

    ParticipantDetail:
      type: object
      required: [uid, team_id, is_winner, is_draw, rank_score_before, rank_score_delta, rank_score_after, survival_time, kills, deaths]
      properties:
        uid:
          type: integer
          format: int64
          description: Participant HRPAuth UID
        team_id:
          type: string
        is_winner:
          type: boolean
        is_draw:
          type: boolean
          description: True for draws (all-draw reports settle with S=0.5)
        rank_score_before:
          type: integer
        rank_score_delta:
          type: integer
        rank_score_after:
          type: integer
          description: max(0, rank_score_before + rank_score_delta)
        survival_time:
          type: integer
        kills:
          type: integer
        deaths:
          type: integer

    QueueEntry:
      type: object
      required: [uid, match_type, rank_score, enqueued_at]
      properties:
        uid:
          type: integer
          format: int64
        match_type:
          type: string
        rank_score:
          type: integer
          description: Rating snapshot taken at join time
        party_id:
          type: integer
          format: int64
          description: Ephemeral party id when queued as a party (omitted for solo)
        enqueued_at:
          type: string
          format: date-time

    MatchmakingStatus:
      type: object
      required: [in_queue, recent_groups]
      properties:
        in_queue:
          type: boolean
        queue_entry:
          $ref: '#/components/schemas/QueueEntry'
        recent_groups:
          type: array
          description: Formed matches containing the user, most recent first (up to 10)
          items:
            $ref: '#/components/schemas/FormedGroup'

    FormedGroup:
      type: object
      required: [group_id, match_type, formed_at, members]
      properties:
        group_id:
          type: integer
          format: int64
        match_type:
          type: string
        formed_at:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: '#/components/schemas/GroupMember'

    GroupMember:
      type: object
      required: [uid, team_id, rank_score]
      properties:
        uid:
          type: integer
          format: int64
        team_id:
          type: string
          description: Assigned team label (A/B/C...)
        rank_score:
          type: integer
          description: Rating at match formation
        party_id:
          type: integer
          format: int64
          description: Party id when the member queued as part of a party (omitted for solo)

    MetricsSnapshot:
      type: object
      required: [counters, queue_depth]
      properties:
        counters:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: >
            Process-local counters keyed by metric name (optionally
            label-suffixed, e.g. matches_rejected_total:mca_report_inconsistent)
        queue_depth:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Live queue depth keyed by match mode
    
    # ─── Rankings ──────────────────────────────────────────────────────────
    Ranking:
      type: object
      required: [id, user_uuid, rank_type, score, rank_position, season, updated_at]
      properties:
        id:
          type: integer
          format: int64
        user_uuid:
          type: string
          format: uuid
        rank_type:
          type: string
        score:
          type: integer
          format: int64
        rank_position:
          type: integer
        season:
          type: integer
        updated_at:
          type: string
          format: date-time
