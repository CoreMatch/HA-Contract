openapi: 3.1.0
info:
  title: HRPAuth Business API
  version: 1.0.0
  description: >
    Unified specification for HA business interfaces. Yggdrasil compatible interfaces are outside the scope of this file.
servers:
  - url: /
paths:
  /status:
    get:
      summary: Get service status
      responses:
        '200':
          description: Success
  /login:
    post:
      summary: Deprecated legacy login endpoint
      deprecated: true
      responses:
        '410': { $ref: '#/components/responses/Error' }
  /loginbymt:
    post:
      summary: Deprecated legacy Manage Token login endpoint
      deprecated: true
      responses:
        '410': { $ref: '#/components/responses/Error' }
  /oauth/login-ticket:
    post:
      summary: Verify password and issue a short-lived login ticket or first-party tokens
      description: >
        First-party password login entrypoint. If neither TOTP, WebAuthn, nor Email 2FA
        is enabled for the user, the server returns OAuth2 access/refresh tokens
        directly. Otherwise it returns a short-lived `login_ticket` plus
        `totp_required`, `webauthn_required`, `email_required`, and `second_factors`
        so the client can choose an allowed second factor.
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /oauth/authorize:
    get:
      summary: Validate authorization request for authorization_code + PKCE
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
  /oauth/authorize/decision:
    post:
      summary: Complete interactive authorization and issue authorization code
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /oauth/token:
    post:
      summary: OAuth2 token endpoint
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /oauth/revoke:
    post:
      summary: Revoke OAuth2 access token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /forgot-password:
    post:
      summary: Send recovery verification code to email
      description: >
        Validates the captcha and sends a 4-digit recovery code to the
        provided email address if it is registered. The response is always
        successful to prevent email enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, captcha_token, captcha_code]
              properties:
                email:
                  type: string
                  format: email
                captcha_token:
                  type: string
                captcha_code:
                  type: string
      responses:
        '200':
          description: If the email is registered, a verification code has been sent.
        '400': { $ref: '#/components/responses/Error' }
  /reset-password:
    post:
      summary: Reset password using recovery code
      description: >
        Submits the 4-digit recovery code and a new password to reset the
        account password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, new_password]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: '^[0-9]{4}$'
                  description: 4-digit recovery code
                new_password:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Password reset successful
        '400': { $ref: '#/components/responses/Error' }
  /register:
    post:
      summary: Register user or proxy-register via Bearer service token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /logout:
    get:
      summary: Revoke current Bearer access token
      responses:
        '200': { description: Success }
        '401': { $ref: '#/components/responses/Error' }
  /admin/claim-user:
    post:
      summary: Operator claim of a proxy-registered user (cbh=0)
      description: >
        Assigns a real email + password to a proxy-registered user identified
        by `username` so that the user can log in to the business system
        via WebUI. Requires an OAuth2 Service Token carrying the
        `user.claim.as-service` scope. On success the user's `cbh` is flipped
        from 0 to 1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username:
                  type: string
                  description: Username of the target user (>= 3 chars).
                email:
                  type: string
                  description: New email the user will use to log in.
                password:
                  type: string
                  description: New password (>= 6 chars, hashed via bcrypt).
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/force-bind:
    post:
      summary: Force-transfer Mojang UUID from proxy account to target account
      description: >
        Transfers the `mojang_uuid` from a proxy-registered user (cbh=0)
        identified by `username` to a manually registered account identified
        by `email` + `password`, then deletes the proxy-registered account.
        Requires an OAuth2 Service Token and a valid `manage_token` in the
        request body. This endpoint is intended for players who have both a
        proxy-registered account (from WinnerProxy) and a manually registered
        account, and want to consolidate their Mojang identity onto the manual
        account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password, manage_token]
              properties:
                username:
                  type: string
                  description: Username of the proxy-registered account (cbh=0), auto-detected from the player session.
                email:
                  type: string
                  description: Email of the target manually registered account.
                password:
                  type: string
                  description: Password of the target manually registered account.
                manage_token:
                  type: string
                  description: Operator manage token for authorization.
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /user:
    post:
      summary: Get user information via Bearer token
      responses:
        '200': { description: Success }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: Request account deletion (enter cooling period)
      description: >
        Soft-deletes the user and revokes all tokens. The account remains in a
        cooling period (3-8 days) and can be restored by logging in again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  description: User's password for confirmation.
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /user/deleted:
    get:
      summary: List accounts in deletion cooling period (Operator only)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      deleted_accounts:
                        type: array
                        items:
                          $ref: '#/components/schemas/DeletedAccount'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /user/declare-email:
    post:
      summary: Declare email via Bearer service token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /user/mojang-bind-enable:
    post:
      summary: Enable Mojang binding via Bearer token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /user/mojang-bind-disable:
    post:
      summary: Disable Mojang binding via Bearer token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /user/security/change-email/send-code:
    post:
      summary: Send verification code to current email for email change
      description: Requires `user.security.manage` scope.
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /user/security/change-email/webauthn-begin:
    post:
      summary: Start WebAuthn sudo authentication for email change
      description: Requires `user.security.manage` scope.
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /user/security/change-email:
    post:
      summary: Change user email and optionally password
      description: >
        Requires `user.security.manage` scope. Supports two verification paths:
        1. Password + 1 factor (TOTP, Email Code, or WebAuthn).
        2. Any 2 factors (TOTP, Email Code, WebAuthn).
        If path 2 is used, current password is not required and a new password can be set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_email]
              properties:
                new_email: { type: string, format: email }
                current_password: { type: string }
                new_password: { type: string, minLength: 6 }
                totp_code: { type: string }
                email_code: { type: string }
                webauthn:
                  type: object
                  properties:
                    flow_id: { type: string }
                    credential: { type: object, additionalProperties: true }
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /user/lookup:
    post:
      summary: Resolve username from UID or UID from username
      description: >
        Public endpoint — no authentication required.
        Provide exactly one of `uid` (numeric) or `username` (string).
        If `uid` is provided, returns the matching user's `uid` and `username`.
        If `username` is provided, returns the matching user's `uid` and `username`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    uid:
                      type: integer
                      description: Numeric UID to look up
                  required: [uid]
                - type: object
                  properties:
                    username:
                      type: string
                      description: Username to look up
                  required: [username]
      responses:
        '200':
          description: Lookup successful
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: lookup successful
                  data:
                    type: object
                    required: [uid, username]
                    properties:
                      uid:
                        type: integer
                        example: 42
                      username:
                        type: string
                        example: Steve
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /email-verification:
    post:
      summary: Entry point for email verification actions
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /email-2fa/send:
    post:
      summary: Send 2FA verification code to user's email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_ticket]
              properties:
                login_ticket: { type: string }
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /email-2fa/verify:
    post:
      summary: Verify email 2FA code and issue tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_ticket, code]
              properties:
                login_ticket: { type: string }
                code: { type: string }
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /email-2fa/toggle:
    post:
      summary: Enable or disable email 2FA via Bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /email-2fa/status:
    get:
      summary: Query email 2FA status via Bearer token
      parameters:
        - in: query
          name: uid
          required: true
          schema: { type: string }
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /totpgen:
    get:
      summary: Generate current OTP for a specified secret
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
  /totp/setup:
    post:
      summary: Setup TOTP via Bearer token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /totp/verify:
    post:
      summary: Verify TOTP with login_ticket and issue first-party OAuth2 tokens
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /totp/toggle:
    post:
      summary: Enable or disable two-factor authentication via Bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /totp/hasbeenenabled:
    post:
      summary: Query whether TOTP is enabled via Bearer token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /webauthn/register/begin:
    post:
      summary: Start WebAuthn credential registration via Bearer token
      description: >
        Begins a WebAuthn registration ceremony for the authenticated user.
        The optional request body may provide a friendly credential name and an
        `attachment` hint (`platform` or `cross-platform`).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnRegistrationBeginRequest'
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /webauthn/register/finish:
    post:
      summary: Finish WebAuthn credential registration via Bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnFinishRequest'
      responses:
        '201': { description: Credential registered }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /webauthn/credentials:
    get:
      summary: List the authenticated user's WebAuthn credentials
      responses:
        '200': { description: Success }
        '401': { $ref: '#/components/responses/Error' }
  /webauthn/credentials/{id}:
    delete:
      summary: Delete a WebAuthn credential via Bearer token
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200': { description: Credential deleted }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /webauthn/2fa/toggle:
    post:
      summary: Enable or disable WebAuthn as the password second factor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnToggle2FARequest'
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /webauthn/login/begin:
    post:
      summary: Start a WebAuthn primary login ceremony
      description: >
        Starts a passkey / security-key login flow. If `email` is provided, the
        server uses an account-bound ceremony; if omitted, it starts a
        discoverable passkey ceremony.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnLoginBeginRequest'
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /webauthn/login/finish:
    post:
      summary: Finish a WebAuthn primary login ceremony and issue OAuth2 tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnFinishRequest'
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /webauthn/2fa/begin:
    post:
      summary: Start a WebAuthn second-factor ceremony from login_ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnSecondFactorBeginRequest'
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /webauthn/2fa/finish:
    post:
      summary: Finish a WebAuthn second-factor ceremony and issue OAuth2 tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnFinishRequest'
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /change-username:
    post:
      summary: Change username via Bearer token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /change-profile-name:
    post:
      summary: Change profile name via Bearer token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /generate-key:
    post:
      summary: Generate key pair
      responses:
        '200': { description: Success }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /texture/upload:
    post:
      summary: Upload user texture via Bearer token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /texture/delete:
    post:
      summary: Delete user texture via Bearer token
      description: >
        Forwarded unchanged by HASkinProxy at POST /{username}/texture/delete.
        The HASkinProxy forwarder does not authenticate the request itself;
        the Authorization header and the body are forwarded verbatim, and the
        upstream response (status + body) is returned to the client unchanged.
        See haskinproxy-business.yaml for the forwarder's cache-eviction
        behavior on success.
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /texture/get:
    post:
      summary: Get user texture via Bearer token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /texture/mojang/{uuid}:
    get:
      summary: Fetch a Mojang player's texture (skin or cape) by UUID
      description: >
        Proxies the texture download from Mojang's session server and CDN.
        No authentication required. Returns the raw PNG image.
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
          description: Mojang UUID (with or without hyphens)
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum: [skin, cape]
            default: skin
          description: Texture type to fetch
      responses:
        '200':
          description: Raw PNG image
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /mojang/profile/{uuid}:
    get:
      summary: Fetch a Mojang player's profile (id, name, cape availability)
      description: >
        Proxies the profile lookup from Mojang's session server.
        No authentication required. Returns the player's UUID, display name
        and whether a cape is available. This is a lightweight endpoint that
        does not download any texture data.
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
          description: Mojang UUID (with or without hyphens)
      responses:
        '200':
          description: Mojang profile info
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 获取 Mojang Profile 成功
                  id:
                    type: string
                    description: Mojang UUID (no hyphens)
                    example: 069a79f444e94726a5befca90e38aaf5
                  name:
                    type: string
                    description: Player display name
                    example: Notch
                  has_cape:
                    type: boolean
                    description: Whether the player has a cape
                    example: true
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /texture/rewrite-callback:
    post:
      summary: Rewrite all stored texture callback URLs to current callback.url (Manage Token)
      responses:
        '200': { description: Success }
        '401': { $ref: '#/components/responses/Error' }
  /captcha:
    post:
      summary: Generate captcha
      responses:
        '200': { description: Success }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /captcha/enabled:
    get:
      summary: Query captcha switch
      responses:
        '200': { description: Success }
  /captcha/image/{token}:
    get:
      summary: Get captcha image
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Image byte stream
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /services/presence:
    post:
      summary: Register or heartbeat a microservice (bonjour handshake)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresenceRequest'
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
  /services/list:
    get:
      summary: List currently available frontend SDK services
      responses:
        '200': { description: Success }
  /services/sdk/{name}:
    get:
      summary: Relay the JS usage file of a registered service
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: JS file relayed unchanged from the microservice
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /services/route:
    post:
      summary: Register routing rules (pre/post) for a registered service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
  /services/relay:
    post:
      summary: Register relay rules for a registered service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayRequest'
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
    delete:
      summary: Delete a relay rule of a service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayDeleteRequest'
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    get:
      summary: List relay rules, optionally filtered by service
      parameters:
        - in: query
          name: name
          required: false
          schema:
            type: string
          description: Filter by service name
      responses:
        '200': { description: Success }
components:
  responses:
    Error:
      description: Standard error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
    DeletedAccount:
      type: object
      required: [uid, deleted_at]
      properties:
        uid:
          type: integer
        deleted_at:
          type: string
          format: date-time
    WebAuthnRegistrationBeginRequest:
      type: object
      properties:
        name:
          type: string
          description: Optional user-visible name for the credential
        attachment:
          type: string
          enum: [platform, cross-platform]
          description: Optional authenticator attachment hint
    WebAuthnLoginBeginRequest:
      type: object
      properties:
        email:
          type: string
          description: >
            Optional email for account-bound login. Omit to start a
            discoverable passkey ceremony.
    WebAuthnFinishRequest:
      type: object
      required: [flow_id, credential]
      properties:
        flow_id:
          type: string
          description: Server-issued WebAuthn ceremony identifier
        credential:
          type: object
          description: Raw browser WebAuthn response payload
          additionalProperties: true
    WebAuthnSecondFactorBeginRequest:
      type: object
      required: [login_ticket]
      properties:
        login_ticket:
          type: string
          description: Login ticket returned by /oauth/login-ticket
    WebAuthnToggle2FARequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: Whether WebAuthn may be used as a second factor after password verification
    ErrorEnvelope:
      type: object
      required: [success, message, code, error, meta]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        code:
          type: string
        error:
          type: string
          description: Compatible alias, value matches code
        meta:
          $ref: '#/components/schemas/Meta'
    ServiceScope:
      type: object
      required: [name]
      properties:
        name:
          type: string
        frontend_areas:
          type: array
          items:
            type: string
          description: Non-empty means the service is visible to the WebUI host; areas are mount zones inside one WebUI, not separate frontend SDK hosts
    PresenceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        ttl_seconds:
          type: integer
          description: Self-declared lifetime in seconds; <=0 or omitted means never expires
        scope:
          $ref: '#/components/schemas/ServiceScope'
        sdk_url:
          type: string
          description: URL of a JS usage file, relayed by HRPAuth unchanged and intended to be loaded by the single WebUI host runtime
        security_level:
          type: integer
          minimum: 0
          maximum: 2
          description: 0 none / 1 user / 2 ops
        interacts_with:
          type: array
          items:
            type: string
          description: Other services this service interacts with
    RouteRule:
      type: object
      required: [scope, paths]
      properties:
        scope:
          type: string
        paths:
          type: array
          items:
            type: string
          description: Exact paths and * prefix wildcards
        pre_url:
          type: string
          description: Non-empty declares a pre-route
        post_url:
          type: string
          description: Non-empty declares a post-route
    RouteRequest:
      type: object
      required: [name, rules]
      properties:
        name:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RouteRule'
    RelayRule:
      type: object
      required: [dest, source]
      properties:
        dest:
          type: string
          description: Public path prefix on the main service
        source:
          type: string
          description: Microservice address; remaining path is appended
    RelayRequest:
      type: object
      required: [name, relays]
      properties:
        name:
          type: string
        relays:
          type: array
          items:
            $ref: '#/components/schemas/RelayRule'
    RelayDeleteRequest:
      type: object
      required: [name, dest]
      properties:
        name:
          type: string
        dest:
          type: string
    ServiceSummary:
      type: object
      required: [name, scope_name, frontend_areas]
      properties:
        name:
          type: string
        scope_name:
          type: string
        frontend_areas:
          type: array
          items:
            type: string
          description: Frontend mount areas declared by the service SDK
        sdk_url:
          type: string
          description: URL of the service JS usage file, load via /services/sdk/{name} from the frontend SDK consumer
