openapi: 3.1.0
info:
  title: HRPAuth Business API
  version: 1.0.0
  description: >
    Unified specification for HA business interfaces. Yggdrasil compatible interfaces are outside the scope of this file.
servers:
  - url: /
paths:
  /health:
    get:
      summary: Liveness probe
      description: >
        Returns `200` with the unified success envelope and
        `data.status = "ok"`. Performs no database access and no heavy work;
        intended for container healthchecks and load balancers.
      responses:
        '200':
          description: Service is alive.
  /status:
    get:
      summary: Redirect to the service status endpoint
      description: Returns `307 Temporary Redirect` to `GET /`.
      responses:
        '307':
          description: Redirect to `GET /`
  /:
    get:
      summary: Get service status and aggregated root metadata
      description: >
        Returns site information plus any top-level metadata keys contributed
        by registered microservices via their presence `root_metadata`.
      responses:
        '200':
          description: >
            Success; body contains `success`, `message`,
            `site` (`name`, `implementation`, `version`, `url`,
            `frontend_url`), `meta.request_id`, and zero or more service
            contributed top-level keys (e.g. `yggdrasil`)
  /oauth/login-ticket:
    post:
      summary: Verify password and issue a short-lived login ticket or first-party tokens
      description: >
        First-party password login entrypoint. If neither TOTP, WebAuthn, nor Email 2FA
        is enabled for the user, the server returns OAuth2 access/refresh tokens directly
        (recovery key alone does not trigger 2FA). Otherwise it returns a short-lived
        `login_ticket` plus `totp_required`, `webauthn_required`, `email_required`,
        `recovery_key_required`, and `second_factors` so the client can choose
        an allowed second factor.
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /oauth/authorize:
    get:
      summary: Validate authorization request for authorization_code + PKCE
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
  /oauth/authorize/decision:
    post:
      summary: Complete interactive authorization and issue authorization code
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /oauth/token:
    post:
      summary: OAuth2 token endpoint
      description: >
        Supported grants: `authorization_code` (PKCE S256), `refresh_token`,
        `client_credentials`. Service clients calling `client_credentials`
        are the built-in super client (credentials from core config
        `oauth2.super_client_id` / `super_client_secret`), per-service
        clients declared in core config `oauth2.service_clients`
        (`client_id` / `client_secret` / optional `name`) and seeded
        idempotently into `oauth2_clients` at startup, or per-service
        clients self-registered through `POST /oauth/register`. Seeded and
        self-registered rows are confidential, `client_credentials`-only,
        `is_super=false`, `is_active=true`; existing rows are never
        overwritten. Their tokens resolve as service tokens and satisfy
        ops (level 2) auth checks.
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /oauth/revoke:
    post:
      summary: Revoke OAuth2 access token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /oauth/register:
    post:
      summary: Self-service service-client registration (RFC 7591 protected registration)
      description: >
        RFC 7591 protected client registration. The initial access
        credential is the built-in super client, authenticated with
        `client_secret_basic` (RFC 6749 §2.3.1, `Authorization: Basic`);
        user tokens and any other caller are rejected with `401
        oauth_invalid_client`. `client_name` must be a service already
        registered via `/services/presence`, and `scope` (optional,
        space-separated) must stay inside that service's core config
        `oauth2.service_scope_allowlist` entry intersected with the known
        service scope set — super privileges and `db.*` scopes can never
        be granted through this endpoint. Issued clients are fixed to
        `type=confidential`, `grant_types=["client_credentials"]`,
        `is_super=false`, `is_active=true`, with `client_id` equal to the
        service name. Success returns `201` with `client_id`,
        `client_secret`, `client_id_issued_at` (unix seconds) and
        `client_secret_expires_at = 0` (the secret never expires
        automatically). Idempotency is a **deployment extension**, not
        RFC 7591 behavior (which issues a fresh client per registration):
        re-registering an existing service returns the same `client_id`
        and `client_secret` unchanged — no new row, no secret rotation —
        so a satellite can re-derive its credentials after a restart by
        exchanging the super credentials again instead of persisting the
        secret. Config-seeded rows (`oauth2.service_clients`) take
        precedence: self-registering a seeded name returns the seeded row.
        Every call is audit-logged (caller, service, requested scopes,
        outcome, timestamp).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_name]
              properties:
                client_name:
                  type: string
                  description: Presence-registered service name; becomes the `client_id`.
                scope:
                  type: string
                  description: >
                    Optional space-separated scope request bounded by the
                    service's allowlist; omitted means the full allowlist.
      responses:
        '201':
          description: >
            Client registered or returned unchanged (get-or-create
            extension); body carries `client_id`, `client_secret`,
            `client_id_issued_at`, `client_secret_expires_at` (`0` =
            never expires) and the granted `scope`.
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /forgot-password:
    post:
      summary: Send recovery verification code to email
      description: >
        Validates the captcha and sends a 4-digit recovery code to the
        provided email address if it is registered. The response is always
        successful to prevent email enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, captcha_token, captcha_code]
              properties:
                email:
                  type: string
                  format: email
                captcha_token:
                  type: string
                captcha_code:
                  type: string
      responses:
        '200':
          description: If the email is registered, a verification code has been sent.
        '400': { $ref: '#/components/responses/Error' }
  /reset-password:
    post:
      summary: Reset password using recovery code
      description: >
        Submits the 4-digit recovery code and a new password to reset the
        account password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, new_password]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: '^[0-9]{4}$'
                  description: 4-digit recovery code
                new_password:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Password reset successful
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /register:
    post:
      summary: Register a new user (anonymous WebUI registration)
      description: >
        Creates a user from `email` + `username` + `password` with captcha
        verification when enabled. There is no Bearer/service-token branch;
        game-account (proxy) registration lives in HRPAuth-Yggdrasil-API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, password]
              properties:
                email: { type: string, format: email }
                username: { type: string, minLength: 3 }
                password: { type: string, minLength: 6 }
                captcha_token: { type: string }
                captcha_code: { type: string }
      responses:
        '200':
          description: Success; `data` contains `uid` and `uuid`
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /logout:
    get:
      summary: Revoke current Bearer access token
      responses:
        '200': { description: Success }
        '401': { $ref: '#/components/responses/Error' }
  /user/deleted:
    get:
      summary: List accounts in deletion cooling period (Operator only)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      deleted_accounts:
                        type: array
                        items:
                          $ref: '#/components/schemas/DeletedAccount'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /user:
    post:
      summary: Get user information via Bearer token
      responses:
        '200': { description: Success }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: Request account deletion (enter cooling period)
      description: >
        Soft-deletes the user and revokes all tokens. The account remains in a
        cooling period (3-8 days) and can be restored by logging in again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  description: User's password for confirmation.
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /user/declare-email:
    post:
      summary: Declare email for a user (removed; deprecation confirmed)
      deprecated: true
      description: >
        Removed from the HRPAuth core in commit 9ab4e64 (2026-10-06); calls
        receive the standard 404 `route_not_found` response. Deprecation was
        confirmed by author decision on 2026-11-05: this endpoint will NOT
        return in any form, and there is no service-to-service successor for
        it. Giving a claimed email to a proxy-registered account is part of
        the claim flow instead — `POST /admin/claim-user` in
        `openapi/hrpauth-yggdrasil-business.yaml`. The former
        `user.declare-email` scope has been removed from the core scope
        registry. This entry is kept solely as a historical record.
      responses:
        '404': { $ref: '#/components/responses/Error' }
  /user/security/change-email/send-code:
    post:
      summary: Send verification code to current email for email change
      description: Requires `user.security.manage` scope.
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /user/security/change-email/webauthn-begin:
    post:
      summary: Start WebAuthn sudo authentication for email change
      description: Requires `user.security.manage` scope.
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /user/security/change-email:
    post:
      summary: Change user email
      description: >
        Requires `user.security.manage` scope. The request must carry at least
        one verified second factor (TOTP, email code, WebAuthn sudo flow, or
        recovery key); there is no password-based path and no password change
        in this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_email]
              properties:
                new_email: { type: string, format: email }
                totp_code: { type: string }
                email_code: { type: string }
                recovery_key: { type: string }
                webauthn:
                  type: object
                  properties:
                    flow_id: { type: string }
                    credential: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Success; `data` contains the updated `email`
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /user/security/recovery-key/create:
    post:
      summary: Create initial recovery key
      description: >
        Requires `user.security.manage` scope. Does not require any verification
        factor, only the user's login session. Fails if a recovery key is already
        configured.
      responses:
        '200':
          description: Recovery key created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      recovery_key: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /user/security/recovery-key/regenerate:
    post:
      summary: Regenerate recovery key
      description: >
        Requires `user.security.manage` scope and at least one verification factor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryKeyRequest'
      responses:
        '200':
          description: Recovery key regenerated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      recovery_key: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /user/security/recovery-key/revoke:
    post:
      summary: Revoke recovery key
      description: >
        Requires `user.security.manage` scope and at least one verification factor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryKeyRequest'
      responses:
        '200': { description: Recovery key revoked successfully }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /user/security/recovery-key/verify:
    post:
      summary: Verify recovery key with login_ticket and issue OAuth2 tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_ticket, recovery_key]
              properties:
                login_ticket: { type: string }
                recovery_key: { type: string }
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /user/security/2fa/status:
    post:
      summary: Query all two-factor authentication status via Bearer token
      description: >
        Requires `user.security.manage` scope. Supports providing `uid` via
        query parameter or JSON request body. Returns status for TOTP, WebAuthn,
        Email 2FA, and Recovery Key.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                uid: { type: string }
      parameters:
        - in: query
          name: uid
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      totp_enabled: { type: boolean }
                      webauthn_2fa_enabled: { type: boolean }
                      webauthn_credentials: { type: integer }
                      recovery_key_enabled: { type: boolean }
                      email_2fa_enabled: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /user/lookup:
    post:
      summary: Resolve username from UID or UID from username
      description: >
        Public endpoint — no authentication required.
        Provide exactly one of `uid` (numeric) or `username` (string).
        If `uid` is provided, returns the matching user's `uid` and `username`.
        If `username` is provided, returns the matching user's `uid` and `username`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    uid:
                      type: integer
                      description: Numeric UID to look up
                  required: [uid]
                - type: object
                  properties:
                    username:
                      type: string
                      description: Username to look up
                  required: [username]
      responses:
        '200':
          description: Lookup successful
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: lookup successful
                  data:
                    type: object
                    required: [uid, username]
                    properties:
                      uid:
                        type: integer
                        example: 42
                      username:
                        type: string
                        example: Steve
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /email-verification:
    post:
      summary: Entry point for email verification actions
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /email-2fa/send:
    post:
      summary: Send 2FA verification code to user's email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_ticket]
              properties:
                login_ticket: { type: string }
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /email-2fa/verify:
    post:
      summary: Verify email 2FA code and issue tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_ticket, code]
              properties:
                login_ticket: { type: string }
                code: { type: string }
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /email-2fa/toggle:
    post:
      summary: Enable or disable email 2FA via Bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /totpgen:
    get:
      summary: Generate current OTP for a specified secret
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
  /totp/setup:
    post:
      summary: Setup TOTP via Bearer token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /totp/verify:
    post:
      summary: Verify TOTP with login_ticket and issue first-party OAuth2 tokens
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /totp/toggle:
    post:
      summary: Enable or disable two-factor authentication via Bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /webauthn/register/begin:
    post:
      summary: Start WebAuthn credential registration via Bearer token
      description: >
        Begins a WebAuthn registration ceremony for the authenticated user.
        The optional request body may provide a friendly credential name and an
        `attachment` hint (`platform` or `cross-platform`).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnRegistrationBeginRequest'
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /webauthn/register/finish:
    post:
      summary: Finish WebAuthn credential registration via Bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnFinishRequest'
      responses:
        '201': { description: Credential registered }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /webauthn/credentials:
    get:
      summary: List the authenticated user's WebAuthn credentials
      responses:
        '200': { description: Success }
        '401': { $ref: '#/components/responses/Error' }
  /webauthn/credentials/{id}:
    delete:
      summary: Delete a WebAuthn credential via Bearer token
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200': { description: Credential deleted }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /webauthn/2fa/toggle:
    post:
      summary: Enable or disable WebAuthn as the password second factor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnToggle2FARequest'
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /webauthn/login/begin:
    post:
      summary: Start a WebAuthn primary login ceremony
      description: >
        Starts a passkey / security-key login flow. If `email` is provided, the
        server uses an account-bound ceremony; if omitted, it starts a
        discoverable passkey ceremony.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnLoginBeginRequest'
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /webauthn/login/finish:
    post:
      summary: Finish a WebAuthn primary login ceremony and issue OAuth2 tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnFinishRequest'
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /webauthn/2fa/begin:
    post:
      summary: Start a WebAuthn second-factor ceremony from login_ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnSecondFactorBeginRequest'
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /webauthn/2fa/finish:
    post:
      summary: Finish a WebAuthn second-factor ceremony and issue OAuth2 tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnFinishRequest'
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /change-username:
    post:
      summary: Change username via Bearer token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /captcha:
    post:
      summary: Generate captcha
      responses:
        '200': { description: Success }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /captcha/enabled:
    get:
      summary: Query captcha switch
      responses:
        '200': { description: Success }
  /captcha/image/{token}:
    get:
      summary: Get captcha image
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Image byte stream
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /services/presence:
    post:
      summary: Register or heartbeat a microservice (bonjour handshake)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresenceRequest'
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
  /services/auth-key:
    post:
      summary: Request a temporary internal key for core callbacks
      description: >
        Requires OAuth2 service credentials. The key is generated and stored
        in memory, overwriting any previous key for the same service name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Unique service name
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      internal_key: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /services/route:
    post:
      summary: Register routing rules (pre/post) for a registered service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
  /services/relay:
    post:
      summary: Register relay rules for a registered service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayRequest'
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
    delete:
      summary: Delete a relay rule of a service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayDeleteRequest'
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    get:
      summary: List relay rules, optionally filtered by service
      parameters:
        - in: query
          name: name
          required: false
          schema:
            type: string
          description: Filter by service name
      responses:
        '200': { description: Success }
  /services/sdk-packages:
    post:
      summary: Upload an SDK package archive
      description: >
        Uploads a new SDK package archive (tar.gz / zip) as multipart/form-data.
        The single file field is `package`. On success the package metadata is
        returned with HTTP 201. Requires an ops-level (level 2) OAuth2 Bearer
        token.
      operationId: uploadSdkPackage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [package]
              properties:
                package:
                  type: string
                  format: binary
                  description: SDK package archive file
      responses:
        '201':
          description: Package uploaded and stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    $ref: '#/components/schemas/SdkPackageMeta'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    get:
      summary: List SDK package metadata
      description: >
        Returns metadata for all stored SDK packages. Supports HTTP caching via
        ETag / If-None-Match: when the client sends an If-None-Match header that
        matches the current ETag, the server responds 304 Not Modified without a
        body.
      operationId: listSdkPackages
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Array of package metadata
          headers:
            ETag:
              description: Entity tag for cache validation
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SdkPackageMeta'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '304':
          description: Not modified; the client copy is current (If-None-Match matched)
        '400': { $ref: '#/components/responses/Error' }
  /services/sdk-packages/{name}:
    get:
      summary: Get a single SDK package metadata
      operationId: getSdkPackage
      security:
        - BearerAuth: []
        - $ref: '#/components/parameters/PackageNamePath'
      responses:
        '200':
          description: Package metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    $ref: '#/components/schemas/SdkPackageMeta'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: Delete an SDK package
      operationId: deleteSdkPackage
      security:
        - BearerAuth: []
        - $ref: '#/components/parameters/PackageNamePath'
      responses:
        '200':
          description: Package deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      name: { type: string }
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /services/sdk-packages/{name}/download:
    get:
      summary: Download the raw SDK package archive
      operationId: downloadSdkPackage
      security:
        - BearerAuth: []
        - $ref: '#/components/parameters/PackageNamePath'
      responses:
        '200':
          description: Raw package archive bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /internal/verify-credentials:
    post:
      summary: Verify a user's credentials (internal, service-to-service)
      description: >
        Requires ops (level 2) auth. Used by satellite services to verify an
        email/username + password pair against the core user database. The
        200 body is the raw user identity object (not wrapped in the unified
        envelope); failures return a plain `{"error": "..."}` body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier:
                  type: string
                  description: User email or username
                password:
                  type: string
      responses:
        '200':
          description: >
            Matched user identity serialized from the internal `UserInfo`
            struct without JSON tags, so the keys are the Go field names:
            `UUID`, `Email`, `Username`, `Password` (bcrypt hash).
        '401':
          description: 'Credentials invalid; body is `{"error": "invalid credentials"}`'
  /internal/verify-token:
    post:
      summary: Resolve an OAuth2 access token (internal, service-to-service)
      description: >
        Requires ops (level 2) auth. Used by satellite services to resolve a
        site-side OAuth2 access token. User tokens resolve to the owning
        user; service tokens (client_credentials) resolve to their scope
        set without a user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: >
            Success. For a user token `data` contains `uid`, `uuid`,
            `email`, `username`, `is_service: false` and `scopes`. For a
            service token `data` contains `is_service: true` and `scopes`
            only (no user fields).
        '401': { $ref: '#/components/responses/Error' }
  /internal/claim-user:
    post:
      summary: Provision the core user for a claimed proxy account (internal, service-to-service)
      description: >
        Requires ops (level 2) auth. Creates the core user for a
        proxy-registered game account that is being claimed through
        HRPAuth-Yggdrasil-API `POST /admin/claim-user`: validates email
        format and minimum password length, enforces email uniqueness
        across all core users, and creates the user with `verified=true`.
        Idempotent by username: if the username already belongs to a user
        with the same email, that user is returned; the same username with
        a different email yields 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Success; `data` contains `uid` and `uuid`
        '400':
          description: '`username_too_short` / `invalid_email` / `password_too_short`'
        '401': { $ref: '#/components/responses/Error' }
        '409':
          description: '`email_already_registered` / `username_already_bound`'
  /services/users/{uuid}:
    get:
      summary: Look up a user by UUID (internal, service-to-service)
      description: >
        Requires ops (level 2) auth. Used by satellite services to pull user
        metadata from the core. The gate is the auth level, resolved from a
        `client_credentials` service token (SubjectType `service`, e.g. the
        built-in super client's credentials — the same pattern
        HRPAuth-Yggdrasil-API uses via its `core_api` credentials); such
        tokens carry the service scope set including `user.read.as-service`.
        Registered consumer: MatchCoreArena resolves match-report
        participant UUIDs to UIDs here (see
        `matchcorearena-business.yaml` POST /api/matches). Unknown UUIDs
        answer `404 user_not_found`.
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success; `data` contains `uid`, `uuid`, `email`, `username`
        '404': { $ref: '#/components/responses/Error' }
  /services/hook:
    post:
      summary: Register webhook hook rules for a registered service
      description: >
        The service must be registered via `/services/presence` first. Hook
        rules are invoked during the OAuth2 authorization flow in the phases
        `auth.input`, `auth.risk`, and `auth.post_verify`, with capabilities
        `observe`, `patch`, or `veto` and fail policies `ignore` (default),
        `fail_open`, or `fail_closed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Registered service name
                hooks:
                  type: array
                  items:
                    type: object
                    properties:
                      paths:
                        type: array
                        items: { type: string }
                        description: Matched request paths; a trailing `*` means prefix match
                      phase:
                        type: string
                        enum: [auth.input, auth.risk, auth.post_verify]
                      capability:
                        type: string
                        enum: [observe, patch, veto]
                      priority:
                        type: integer
                      fail_policy:
                        type: string
                        enum: [ignore, fail_open, fail_closed]
                      patch_allowlist:
                        type: array
                        items: { type: string }
                      url:
                        type: string
                        description: Callback URL invoked for matched requests
      responses:
        '200':
          description: Success; `data` contains `service` and accepted rule `count`
        '400': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: OAuth2 Bearer token with ops (level 2) privileges
  parameters:
    PackageNamePath:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: SDK package name
  responses:
    Error:
      description: Standard error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
    DeletedAccount:
      type: object
      required: [uid, deleted_at]
      properties:
        uid:
          type: integer
        deleted_at:
          type: string
          format: date-time
    WebAuthnRegistrationBeginRequest:
      type: object
      properties:
        name:
          type: string
          description: Optional user-visible name for the credential
        attachment:
          type: string
          enum: [platform, cross-platform]
          description: Optional authenticator attachment hint
    WebAuthnLoginBeginRequest:
      type: object
      properties:
        email:
          type: string
          description: >
            Optional email for account-bound login. Omit to start a
            discoverable passkey ceremony.
    WebAuthnFinishRequest:
      type: object
      required: [flow_id, credential]
      properties:
        flow_id:
          type: string
          description: Server-issued WebAuthn ceremony identifier
        credential:
          type: object
          description: Raw browser WebAuthn response payload
          additionalProperties: true
    WebAuthnSecondFactorBeginRequest:
      type: object
      required: [login_ticket]
      properties:
        login_ticket:
          type: string
          description: Login ticket returned by /oauth/login-ticket
    WebAuthnToggle2FARequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: Whether WebAuthn may be used as a second factor after password verification
    RecoveryKeyRequest:
      type: object
      properties:
        totp_code: { type: string }
        email_code: { type: string }
        recovery_key: { type: string }
        webauthn:
          type: object
          properties:
            flow_id: { type: string }
            credential: { type: object, additionalProperties: true }
    ErrorEnvelope:
      type: object
      required: [success, message, code, error, meta]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        code:
          type: string
        error:
          type: string
          description: Compatible alias, value matches code
        meta:
          $ref: '#/components/schemas/Meta'
    ServiceScope:
      type: object
      required: [name]
      properties:
        name:
          type: string
        frontend_areas:
          type: array
          items:
            type: string
          description: Non-empty means the service is visible to the WebUI host; areas are mount zones inside one WebUI, not separate frontend SDK hosts
    PresenceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        ttl_seconds:
          type: integer
          description: Self-declared lifetime in seconds; <=0 or omitted means never expires
        scope:
          $ref: '#/components/schemas/ServiceScope'
        security_level:
          type: integer
          minimum: 0
          maximum: 2
          description: 0 none / 1 user / 2 ops
        interacts_with:
          type: array
          items:
            type: string
          description: Other services this service interacts with
        root_metadata:
          type: object
          additionalProperties: true
          description: >
            Top-level keys the service wants exposed on the core `GET /`
            response; each entry is merged into the root response object
    RouteRule:
      type: object
      required: [scope, paths]
      properties:
        scope:
          type: string
        paths:
          type: array
          items:
            type: string
          description: Exact paths and * prefix wildcards
        pre_url:
          type: string
          description: Non-empty declares a pre-route
        post_url:
          type: string
          description: Non-empty declares a post-route
    RouteRequest:
      type: object
      required: [name, rules]
      properties:
        name:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RouteRule'
    RelayRule:
      type: object
      required: [dest, source]
      properties:
        dest:
          type: string
          description: Public path prefix on the main service
        source:
          type: string
          description: Microservice address; remaining path is appended
    RelayRequest:
      type: object
      required: [name, relays]
      properties:
        name:
          type: string
        relays:
          type: array
          items:
            $ref: '#/components/schemas/RelayRule'
    RelayDeleteRequest:
      type: object
      required: [name, dest]
      properties:
        name:
          type: string
        dest:
          type: string
    SdkPackageMeta:
      type: object
      required: [name, version, sha256, size, uploaded_at, run_scripts]
      properties:
        name:
          type: string
          description: SDK package name (matches manifest name)
        version:
          type: string
          description: Semantic version from manifest
        sha256:
          type: string
          description: SHA-256 digest of the raw archive bytes
        size:
          type: integer
          format: int64
          description: Archive size in bytes
        uploaded_at:
          type: string
          format: date-time
        routes:
          type: array
          items:
            $ref: '#/components/schemas/SdkRouteMeta'
        menu:
          type: array
          items:
            $ref: '#/components/schemas/SdkMenuMeta'
        dashboard:
          type: array
          items:
            $ref: '#/components/schemas/SdkDashboardMeta'
        critical_operations:
          type: array
          items:
            $ref: '#/components/schemas/SdkCriticalOperationMeta'
        dependencies:
          type: object
          additionalProperties:
            type: string
          description: npm dependencies declared in the manifest
        run_scripts:
          type: boolean
          description: Whether to run npm scripts during build
    SdkRouteMeta:
      type: object
      required: [path, module]
      properties:
        path:
          type: string
          description: Frontend route path, starts with /
        module:
          type: string
          description: In-package relative path to a module with default React export
        title:
          type: string
    SdkMenuMeta:
      type: object
      required: [label, path]
      properties:
        label:
          type: string
        path:
          type: string
          description: Must reference a route path
    SdkDashboardMeta:
      type: object
      required: [label, path]
      properties:
        label:
          type: string
        path:
          type: string
          description: Must reference a route path
    SdkCriticalOperationMeta:
      type: object
      required: [label, path]
      properties:
        label:
          type: string
          description: Display label shown in Account Security Critical Operations
        path:
          type: string
          description: Must reference a route path declared by the same SDK package
