openapi: 3.1.0
info:
  title: HRPAuth Business API
  version: 1.0.0
  description: >
    Unified specification for HA business interfaces. Yggdrasil compatible interfaces are outside the scope of this file.
servers:
  - url: /
paths:
  /status:
    get:
      summary: Get service status
      responses:
        '200':
          description: Success
  /login:
    post:
      summary: Deprecated legacy login endpoint
      deprecated: true
      responses:
        '410': { $ref: '#/components/responses/Error' }
  /loginbymt:
    post:
      summary: Deprecated legacy Manage Token login endpoint
      deprecated: true
      responses:
        '410': { $ref: '#/components/responses/Error' }
  /oauth/login-ticket:
    post:
      summary: Verify password and issue a short-lived login ticket or first-party tokens
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /oauth/authorize:
    get:
      summary: Validate authorization request for authorization_code + PKCE
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
  /oauth/authorize/decision:
    post:
      summary: Complete interactive authorization and issue authorization code
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /oauth/token:
    post:
      summary: OAuth2 token endpoint
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /oauth/revoke:
    post:
      summary: Revoke OAuth2 access token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /register:
    post:
      summary: Register user or proxy-register via Bearer service token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /logout:
    get:
      summary: Revoke current Bearer access token
      responses:
        '200': { description: Success }
        '401': { $ref: '#/components/responses/Error' }
  /user:
    post:
      summary: Get user information via Bearer token
      responses:
        '200': { description: Success }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /user/declare-email:
    post:
      summary: Declare email via Bearer service token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /user/mojang-bind-enable:
    post:
      summary: Enable Mojang binding via Bearer token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /email-verification:
    post:
      summary: Entry point for email verification actions
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /totpgen:
    get:
      summary: Generate current OTP for a specified secret
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
  /totp/setup:
    post:
      summary: Setup TOTP via Bearer token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /totp/verify:
    post:
      summary: Verify TOTP with login_ticket and issue first-party OAuth2 tokens
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /totp/toggle:
    post:
      summary: Enable or disable two-factor authentication via Bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /totp/hasbeenenabled:
    post:
      summary: Query whether TOTP is enabled via Bearer token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /change-username:
    post:
      summary: Change username via Bearer token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /change-profile-name:
    post:
      summary: Change profile name via Bearer token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /generate-key:
    post:
      summary: Generate key pair
      responses:
        '200': { description: Success }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /texture/upload:
    post:
      summary: Upload user texture via Bearer token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /texture/delete:
    post:
      summary: Delete user texture via Bearer token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /texture/get:
    post:
      summary: Get user texture via Bearer token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /texture/rewrite-callback:
    post:
      summary: Rewrite all stored texture callback URLs to current callback.url (Manage Token)
      responses:
        '200': { description: Success }
        '401': { $ref: '#/components/responses/Error' }
  /captcha:
    post:
      summary: Generate captcha
      responses:
        '200': { description: Success }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /captcha/enabled:
    get:
      summary: Query captcha switch
      responses:
        '200': { description: Success }
  /captcha/image/{token}:
    get:
      summary: Get captcha image
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Image byte stream
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /services/presence:
    post:
      summary: Register or heartbeat a microservice (bonjour handshake)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresenceRequest'
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
  /services/list:
    get:
      summary: List microservices relevant to a registered frontend service
      parameters:
        - in: query
          name: name
          required: true
          schema:
            type: string
          description: Registered frontend service name
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
  /services/sdk/{name}:
    get:
      summary: Relay the JS usage file of a registered service
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: JS file relayed unchanged from the microservice
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /services/route:
    post:
      summary: Register routing rules (pre/post) for a registered service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
  /services/relay:
    post:
      summary: Register relay rules for a registered service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayRequest'
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
    delete:
      summary: Delete a relay rule of a service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayDeleteRequest'
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    get:
      summary: List relay rules, optionally filtered by service
      parameters:
        - in: query
          name: name
          required: false
          schema:
            type: string
          description: Filter by service name
      responses:
        '200': { description: Success }
components:
  responses:
    Error:
      description: Standard error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
    ErrorEnvelope:
      type: object
      required: [success, message, code, error, meta]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        code:
          type: string
        error:
          type: string
          description: Compatible alias, value matches code
        meta:
          $ref: '#/components/schemas/Meta'
    ServiceScope:
      type: object
      required: [name]
      properties:
        name:
          type: string
        frontend_areas:
          type: array
          items:
            type: string
          description: Non-empty means the service is visible to frontends
    PresenceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        ttl_seconds:
          type: integer
          description: Self-declared lifetime in seconds; <=0 or omitted means never expires
        scope:
          $ref: '#/components/schemas/ServiceScope'
        sdk_url:
          type: string
          description: URL of a JS usage file, relayed by HRPAuth unchanged
        security_level:
          type: integer
          minimum: 0
          maximum: 2
          description: 0 none / 1 user / 2 ops
        interacts_with:
          type: array
          items:
            type: string
          description: Other services this service interacts with
    RouteRule:
      type: object
      required: [scope, paths]
      properties:
        scope:
          type: string
        paths:
          type: array
          items:
            type: string
          description: Exact paths and * prefix wildcards
        pre_url:
          type: string
          description: Non-empty declares a pre-route
        post_url:
          type: string
          description: Non-empty declares a post-route
    RouteRequest:
      type: object
      required: [name, rules]
      properties:
        name:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RouteRule'
    RelayRule:
      type: object
      required: [dest, source]
      properties:
        dest:
          type: string
          description: Public path prefix on the main service
        source:
          type: string
          description: Microservice address; remaining path is appended
    RelayRequest:
      type: object
      required: [name, relays]
      properties:
        name:
          type: string
        relays:
          type: array
          items:
            $ref: '#/components/schemas/RelayRule'
    RelayDeleteRequest:
      type: object
      required: [name, dest]
      properties:
        name:
          type: string
        dest:
          type: string
    ServiceSummary:
      type: object
      required: [name, scope_name]
      properties:
        name:
          type: string
        scope_name:
          type: string
        sdk_url:
          type: string
          description: URL of the service JS usage file, load via /services/sdk/{name}
