openapi: 3.1.0
info:
  title: HRPAuth Business API
  version: 1.0.0
  description: >
    Unified specification for HA business interfaces. Yggdrasil compatible interfaces are outside the scope of this file.
servers:
  - url: /
paths:
  /status:
    get:
      summary: Get service status
      responses:
        '200':
          description: Success
  /login:
    post:
      summary: Deprecated legacy login endpoint
      deprecated: true
      responses:
        '410': { $ref: '#/components/responses/Error' }
  /loginbymt:
    post:
      summary: Deprecated legacy Manage Token login endpoint
      deprecated: true
      responses:
        '410': { $ref: '#/components/responses/Error' }
  /oauth/login-ticket:
    post:
      summary: Verify password and issue a short-lived login ticket or first-party tokens
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /oauth/authorize:
    get:
      summary: Validate authorization request for authorization_code + PKCE
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
  /oauth/authorize/decision:
    post:
      summary: Complete interactive authorization and issue authorization code
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /oauth/token:
    post:
      summary: OAuth2 token endpoint
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /oauth/revoke:
    post:
      summary: Revoke OAuth2 access token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /register:
    post:
      summary: Register user or proxy-register via Bearer service token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /logout:
    get:
      summary: Revoke current Bearer access token
      responses:
        '200': { description: Success }
        '401': { $ref: '#/components/responses/Error' }
  /user:
    post:
      summary: Get user information via Bearer token
      responses:
        '200': { description: Success }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /user/declare-email:
    post:
      summary: Declare email via Bearer service token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /user/mojang-bind-enable:
    post:
      summary: Enable Mojang binding via Bearer token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /email-verification:
    post:
      summary: Entry point for email verification actions
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /totpgen:
    get:
      summary: Generate current OTP for a specified secret
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
  /totp/setup:
    post:
      summary: Setup TOTP via Bearer token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /totp/verify:
    post:
      summary: Verify TOTP with login_ticket and issue first-party OAuth2 tokens
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /totp/toggle:
    post:
      summary: Enable or disable two-factor authentication via Bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /totp/hasbeenenabled:
    post:
      summary: Query whether TOTP is enabled via Bearer token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /change-username:
    post:
      summary: Change username via Bearer token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /change-profile-name:
    post:
      summary: Change profile name via Bearer token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /generate-key:
    post:
      summary: Generate key pair
      responses:
        '200': { description: Success }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /texture/upload:
    post:
      summary: Upload user texture via Bearer token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /texture/delete:
    post:
      summary: Delete user texture via Bearer token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /texture/get:
    post:
      summary: Get user texture via Bearer token
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /captcha:
    post:
      summary: Generate captcha
      responses:
        '200': { description: Success }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /captcha/enabled:
    get:
      summary: Query captcha switch
      responses:
        '200': { description: Success }
  /captcha/image/{token}:
    get:
      summary: Get captcha image
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Image byte stream
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
components:
  responses:
    Error:
      description: Standard error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
    ErrorEnvelope:
      type: object
      required: [success, message, code, error, meta]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        code:
          type: string
        error:
          type: string
          description: Compatible alias, value matches code
        meta:
          $ref: '#/components/schemas/Meta'
