openapi: 3.1.0
info:
  title: HRPAuth Yggdrasil Business API
  version: 1.0.0
  description: Unified specification for HRPAuth-Yggdrasil-API business interfaces (textures, game accounts, Mojang proxy).
servers:
  - url: /
paths:
  /texture/get:
    post:
      summary: Get current profile texture state for the authenticated account
      description: >
        Returns the caller's manageable Minecraft profiles and each profile's
        currently active skin/cape bindings. This endpoint does not expose any
        per-account texture library history.
      security:
        - BearerAuth: []
      responses:
        '200': { description: Profiles and their current texture bindings }
        '401': { $ref: '#/components/responses/Error' }
  /player/profile:
    get:
      summary: Get the authenticated user's game profile
      description: Uses the HRPAuth Core access token; returns null without creating a local account or profile when none exists.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Existing profile, or null when the account has not created one
        '401': { $ref: '#/components/responses/Error' }
    post:
      summary: Manually create the authenticated user's game profile
      description: >
        Validates the HRPAuth Core access token and, only on this explicit
        request, creates a missing local account mapping and profile atomically.
        Creates at most one profile for the caller. The profile UUID may be
        randomly generated, supplied by the caller, or looked up from a Mojang
        username. It does not change accounts.mojang_uuid. Mojang username
        lookup is public and does not verify ownership. Creation is rejected
        when the UUID is already used by a local profile or linked to another
        local account.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [random, custom, mojang]
                uuid:
                  type: string
                  description: Required for custom mode; 32 hexadecimal characters, hyphens optional.
                username:
                  type: string
                  description: Required for mojang mode; a premium Minecraft username.
      responses:
        '201': { description: Profile created }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /texture/upload/{uuid}:
    post:
      summary: Upload and activate a texture for a specific profile
      description: >
        Validates a PNG upload, stores the original texture, generates a WebP
        preview for the profile management UI, generates a PNG face avatar for
        skins, and updates the profile's active textures property. Skins must be
        large enough to extract the face and head overlay. This endpoint is for
        current profile management, not texture-library ingestion.

        Current behavior: multipart form with fields `file` (required),
        `type` (default `skin`) and `model` (default `default`). All
        service-layer failures — including invalid access token, non-owned
        profile, and texture validation errors — are returned as
        `400 texture_upload_failed`. There is no upload rate limiting.
        Uploads larger than `yggdrasil.security.max_texture_file_size`
        (default 512000 bytes; the value `0` disables the size check) fail
        with `400 texture_upload_failed`.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
          description: Profile UUID
      responses:
        '200':
          description: Success; `data` contains `warnings`
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /texture/delete/{uuid}/{type}:
    delete:
      summary: Delete the active texture binding for a specific profile
      description: >
        Removes the current skin or cape binding from the target profile. This
        does not represent texture-library asset deletion.

        Current behavior: a missing or invalid access token returns
        `401 oauth_login_required`; a profile owned by another account returns
        `403 profile_access_denied`; unknown `type` values and missing
        properties/textures surface as `500 texture_delete_failed`.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
        - in: path
          name: type
          required: true
          schema:
            type: string
            enum: [skin, cape]
      responses:
        '200': { description: Texture deleted }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /texture/avatar/{uuid}:
    get:
      summary: Get the current skin's face avatar for a profile
      description: >
        Returns a PNG of the skin's front face with its head overlay, or 404
        when the profile has no local skin. Existing local skins are rendered
        on first access. This does not change the account avatar.
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
          description: Profile UUID, 32 hexadecimal characters with optional hyphens.
      responses:
        '200':
          description: PNG face avatar
          content:
            image/png:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /previews/{fileName}:
    get:
      summary: Get generated preview file for profile texture management
      description: >
        Streams the generated WebP preview used by the profile texture
        management UI.
      parameters:
        - in: path
          name: fileName
          required: true
          schema:
            type: string
      responses:
        '200':
          description: webp file
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /textures/{hash}:
    get:
      summary: Pull original texture file
      parameters:
        - in: path
          name: hash
          required: true
          schema:
            type: string
      responses:
        '200':
          description: png file
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /skin/{username}:
    get:
      summary: Legacy Skin API (CustomSkinAPI compatible)
      description: >
        Also served under the alias path
        `GET /skins/MinecraftSkins/{username}` for authlib-injector legacy
        skin API compatibility.
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
      responses:
        '200':
          description: png file
        '204':
          description: No texture for user
  /mojang/profile/{uuid}:
    get:
      summary: Proxy Mojang profile lookup
      description: >
        Proxies sessionserver.mojang.com and reports whether the profile has a
        cape. Current behavior: always returns HTTP 200; failures are expressed
        as `success: false` with a `code` (e.g. `invalid_mojang_uuid`), and the
        response body is emitted without the unified `meta.request_id` field.
      parameters:
        - in: path
          name: uuid
          required: true
          schema: { type: string }
      responses:
        '200':
          description: >
            `success: true` with `id`, `name`, `has_cape`; or `success: false`
            with a `code` for invalid/unresolvable UUIDs
  /texture/mojang/{uuid}:
    get:
      summary: Redirect to the Mojang texture for a UUID
      description: >
        Current behavior: resolves the Mojang profile and returns
        `302 Found` pointing at the texture URL on textures.minecraft.net
        (intended for direct `<img>` loading).
      parameters:
        - in: path
          name: uuid
          required: true
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string, enum: [skin, cape] }
      responses:
        '302': { description: Redirect to the Mojang texture URL }
        '400': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /player:
    get:
      summary: Get the game account summary for the authenticated user
      description: >
        Resolves the HRPAuth Core Bearer token to the local game account and
        returns its summary fields.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success; `data` contains `uid`, `account_id`, `mbe`, `mojang_uuid`, `cbh`
        '401': { $ref: '#/components/responses/Error' }
  /player/mojang-bind-enable:
    post:
      summary: Enable the Mojang bind flow for the authenticated account
      description: >
        Sets `mbe=true` and schedules a 15-minute automatic revert if the
        binding is not completed.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success; `data` is the updated player summary (`uid`, `account_id`, `mbe`, `mojang_uuid`, `cbh`)
        '401': { $ref: '#/components/responses/Error' }
  /player/mojang-bind-disable:
    post:
      summary: Disable the Mojang bind flow for the authenticated account
      description: Sets `mbe=false`.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success; `data` is the updated player summary (`uid`, `account_id`, `mbe`, `mojang_uuid`, `cbh`)
        '401': { $ref: '#/components/responses/Error' }
  /register:
    post:
      summary: Create a game account for an existing HRPAuth Core user
      description: >
        Verifies the user's core credentials and creates the local game
        account plus its first profile. Subject to login rate limiting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier:
                  type: string
                  description: Core user email or username
                password:
                  type: string
                mojang_uuid:
                  type: string
                  description: Optional Mojang UUID to link at registration time
      responses:
        '200':
          description: Success; `data` contains `account_id` and `profile` (`id`, `name`)
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /internal/proxy-register:
    post:
      summary: Register a proxy (bot) game account (internal, service-to-service)
      description: >
        Authenticated via the `X-Internal-Key` header. Creates a
        proxy-registered account (`cbh=0`) used by proxy flows.
      parameters:
        - $ref: '#/components/parameters/InternalKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
                mojang_uuid: { type: string }
      responses:
        '200':
          description: Success; `data` contains `account_id` and `profile_id`
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /internal/heartbeat:
    get:
      summary: Liveness probe for internal callbacks (internal, service-to-service)
      description: Authenticated via the `X-Internal-Key` header.
      parameters:
        - $ref: '#/components/parameters/InternalKeyHeader'
      responses:
        '200': { description: Success }
        '401': { $ref: '#/components/responses/Error' }
  /admin/claim-user:
    post:
      summary: Claim a proxy-registered game account (plugin self-service)
      description: >
        Converts a proxy-registered game account (`cbh=0`) into a claimed
        one (`cbh=1`). Authenticated with an OAuth2 service token Bearer
        carrying the `user.claim.as-service` scope; called by the Velocity
        plugin (`/ha reg`) on behalf of the player, who is identified by
        their game profile name. The service provisions the core user
        (email + bcrypt password, `verified=true`) through the core's
        `POST /internal/claim-user`, then links the core user to the game
        account and sets `cbh=1`. Email uniqueness is enforced against the
        core user table by the core. The proxy account's `mojang_uuid` is
        kept unchanged.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username:
                  type: string
                  description: Game profile name of the proxy account (min 3 chars)
                email:
                  type: string
                  format: email
                password:
                  type: string
                  description: Min 6 chars
      responses:
        '200':
          description: Success; `data` contains `uid`, `username`, `email`
        '400':
          description: '`username_too_short` / `invalid_email` / `password_too_short`'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Not a service token or missing `user.claim.as-service` scope
        '404':
          description: '`user_not_found` (no game account for that profile name)'
        '409':
          description: '`user_not_claimable` (already claimed) / `email_already_registered` / `username_already_bound`'
  /admin/force-bind:
    post:
      summary: Transfer a Mojang UUID from a proxy account to a manual account
      description: >
        Authenticated with an OAuth2 service token Bearer plus the operator
        manage token in the body (`manage_token`). Transfers `mojang_uuid`
        from the proxy-registered source account (`cbh=0`, matched by game
        profile name) to the target account identified by core email +
        password (verified through the core's
        `POST /internal/verify-credentials`), then deletes the source
        account together with its profiles, tokens and sessions. All
        game-side writes happen in a single local transaction; the core
        call is read-only. If the target core user has no game account yet,
        one is created (`cbh=1`) as part of the same transaction. Called by
        the Velocity plugin (`/ha forcebind`). Unknown target email and
        wrong password are both reported as `403 invalid_credentials`
        (merged relative to the legacy pre-split endpoint).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password, manage_token]
              properties:
                username:
                  type: string
                  description: Game profile name of the proxy (source) account (min 3 chars)
                email:
                  type: string
                  format: email
                  description: Target (manual) account email
                password:
                  type: string
                  description: Target account password (min 6 chars)
                manage_token:
                  type: string
      responses:
        '200':
          description: Success; `data` contains the transferred `mojang_uuid`
        '400':
          description: '`username_too_short` / `invalid_email` / `password_too_short` / `no_mojang_uuid`'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: '`invalid_manage_token` / `invalid_credentials` / not a service token'
        '404':
          description: '`user_not_found` (no proxy account for that profile name)'
        '409':
          description: '`mojang_uuid_already_bound` (target account already bound to a different Mojang UUID)'
components:
  parameters:
    InternalKeyHeader:
      name: X-Internal-Key
      in: header
      required: true
      schema:
        type: string
      description: Temporary internal key issued by HRPAuth Core (`POST /services/auth-key`)
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Standard error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
    ErrorEnvelope:
      type: object
      required: [success, message, code, error, meta]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        code:
          type: string
        error:
          type: string
        meta:
          $ref: '#/components/schemas/Meta'
