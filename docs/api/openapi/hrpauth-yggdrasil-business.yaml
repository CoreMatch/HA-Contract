openapi: 3.1.0
info:
  title: HRPAuth Yggdrasil Business API
  version: 1.0.0
  description: Unified specification for HRPAuth-Yggdrasil-API business interfaces (textures, game accounts, Mojang proxy).
servers:
  - url: /
paths:
  /texture/get:
    post:
      summary: Get current profile texture state for the authenticated account
      description: >
        Returns the caller's manageable Minecraft profiles and each profile's
        currently active skin/cape bindings. This endpoint does not expose any
        per-account texture library history.
      security:
        - BearerAuth: []
      responses:
        '200': { description: Profiles and their current texture bindings }
        '401': { $ref: '#/components/responses/Error' }
  /player/profile:
    get:
      summary: Get the authenticated user's game profile
      description: Uses the HRPAuth Core access token; returns null without creating a local account or profile when none exists.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Existing profile, or null when the account has not created one
        '401': { $ref: '#/components/responses/Error' }
    post:
      summary: Manually create the authenticated user's game profile
      description: >
        Validates the HRPAuth Core access token and, only on this explicit
        request, creates a missing local account mapping and profile atomically.
        Creates at most one profile for the caller. The profile UUID may be
        randomly generated, supplied by the caller, or looked up from a Mojang
        username. It does not change accounts.mojang_uuid. Mojang username
        lookup is public and does not verify ownership. Creation is rejected
        when the UUID is already used by a local profile or linked to another
        local account.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [random, custom, mojang]
                uuid:
                  type: string
                  description: Required for custom mode; 32 hexadecimal characters, hyphens optional.
                username:
                  type: string
                  description: Required for mojang mode; a premium Minecraft username.
      responses:
        '201': { description: Profile created }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /texture/upload/{uuid}:
    post:
      summary: Upload and activate a texture for a specific profile
      description: >
        Validates a PNG upload, stores the original texture, generates a WebP
        preview for the profile management UI, generates a PNG face avatar for
        skins, and updates the profile's active textures property. Skins must be
        large enough to extract the face and head overlay. This endpoint is for
        current profile management, not texture-library ingestion.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
          description: Profile UUID
      responses:
        '200': { description: Successfully updated existing record }
        '201': { description: Successfully created new record }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /texture/delete/{uuid}/{type}:
    delete:
      summary: Delete the active texture binding for a specific profile
      description: >
        Removes the current skin or cape binding from the target profile. This
        does not represent texture-library asset deletion.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
        - in: path
          name: type
          required: true
          schema:
            type: string
            enum: [skin, cape]
      responses:
        '200': { description: Texture deleted }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /texture/avatar/{uuid}:
    get:
      summary: Get the current skin's face avatar for a profile
      description: >
        Returns a PNG of the skin's front face with its head overlay, or 404
        when the profile has no local skin. Existing local skins are rendered
        on first access. This does not change the account avatar.
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
          description: Profile UUID, 32 hexadecimal characters with optional hyphens.
      responses:
        '200':
          description: PNG face avatar
          content:
            image/png:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /previews/{fileName}:
    get:
      summary: Get generated preview file for profile texture management
      description: >
        Streams the generated WebP preview used by the profile texture
        management UI.
      parameters:
        - in: path
          name: fileName
          required: true
          schema:
            type: string
      responses:
        '200':
          description: webp file
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /textures/{hash}:
    get:
      summary: Pull original texture file
      parameters:
        - in: path
          name: hash
          required: true
          schema:
            type: string
      responses:
        '200':
          description: png file
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /skin/{username}:
    get:
      summary: Legacy Skin API (CustomSkinAPI compatible)
      description: >
        Also served under the alias path
        `GET /skins/MinecraftSkins/{username}` for authlib-injector legacy
        skin API compatibility.
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
      responses:
        '200':
          description: png file
        '204':
          description: No texture for user
  /admin/claim-user:
    post:
      summary: Operator claim of a proxy-registered game account (cbh=0)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string }
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /admin/force-bind:
    post:
      summary: Force-transfer Mojang UUID from proxy account to target account
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password, manage_token]
              properties:
                username: { type: string }
                email: { type: string }
                password: { type: string }
                manage_token: { type: string }
      responses:
        '200': { description: Success }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /mojang/profile/{uuid}:
    get:
      summary: Proxy Mojang profile lookup
      parameters:
        - in: path
          name: uuid
          required: true
          schema: { type: string }
      responses:
        '200': { description: Success }
        '404': { $ref: '#/components/responses/Error' }
  /texture/mojang/{uuid}:
    get:
      summary: Proxy Mojang texture download
      parameters:
        - in: path
          name: uuid
          required: true
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string, enum: [skin, cape] }
      responses:
        '200': { description: png file }
        '404': { $ref: '#/components/responses/Error' }
  /player:
    get:
      summary: Get the game account summary for the authenticated user
      description: >
        Resolves the HRPAuth Core Bearer token to the local game account and
        returns its summary fields.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success; `data` contains `uid`, `account_id`, `mbe`, `mojang_uuid`, `cbh`
        '401': { $ref: '#/components/responses/Error' }
  /player/mojang-bind-enable:
    post:
      summary: Enable the Mojang bind flow for the authenticated account
      description: >
        Sets `mbe=true` and schedules a 15-minute automatic revert if the
        binding is not completed.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success; `data` is the updated player summary (`uid`, `account_id`, `mbe`, `mojang_uuid`, `cbh`)
        '401': { $ref: '#/components/responses/Error' }
  /player/mojang-bind-disable:
    post:
      summary: Disable the Mojang bind flow for the authenticated account
      description: Sets `mbe=false`.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success; `data` is the updated player summary (`uid`, `account_id`, `mbe`, `mojang_uuid`, `cbh`)
        '401': { $ref: '#/components/responses/Error' }
  /register:
    post:
      summary: Create a game account for an existing HRPAuth Core user
      description: >
        Verifies the user's core credentials and creates the local game
        account plus its first profile. Subject to login rate limiting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier:
                  type: string
                  description: Core user email or username
                password:
                  type: string
                mojang_uuid:
                  type: string
                  description: Optional Mojang UUID to link at registration time
      responses:
        '200':
          description: Success; `data` contains `account_id` and `profile` (`id`, `name`)
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /internal/proxy-register:
    post:
      summary: Register a proxy (bot) game account (internal, service-to-service)
      description: >
        Authenticated via the `X-Internal-Key` header. Creates a
        proxy-registered account (`cbh=0`) used by proxy flows.
      parameters:
        - $ref: '#/components/parameters/InternalKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
                mojang_uuid: { type: string }
      responses:
        '200':
          description: Success; `data` contains `account_id` and `profile_id`
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /internal/heartbeat:
    get:
      summary: Liveness probe for internal callbacks (internal, service-to-service)
      description: Authenticated via the `X-Internal-Key` header.
      parameters:
        - $ref: '#/components/parameters/InternalKeyHeader'
      responses:
        '200': { description: Success }
        '401': { $ref: '#/components/responses/Error' }
components:
  parameters:
    InternalKeyHeader:
      name: X-Internal-Key
      in: header
      required: true
      schema:
        type: string
      description: Temporary internal key issued by HRPAuth Core (`POST /services/auth-key`)
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Standard error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
    ErrorEnvelope:
      type: object
      required: [success, message, code, error, meta]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        code:
          type: string
        error:
          type: string
        meta:
          $ref: '#/components/schemas/Meta'
